本进程收到身份权限模块的变更通知（停用账号、改角色等）就立刻清缓存；其他副本最多 30 秒后生效", "防跨站伪造（别的网站借用户的登录状态偷偷发请求）：平台下发一个页面能读到的 cookie，写请求要把它的值抄进请求头，两者一致才放行；别的网站读不到这个值", "只认人，不判权限：能不能做由各模块自己判断"], "ref": "§4.2", "code": "backend/http/auth/", "ws": "ws_auth", "shape": "gate"}, {"id": "A3", "z": "API", "kind": "machine", "icon": "🪪", "name": "开放 API 认证", "x": 930, "y": 500, "w": 460, "h": 150, "one": "核对接入应用的凭据，以及它替哪个用户调用；按应用限制调用频率。", "steps": ["调用次数在进程内存里计数；部署多个请求进程时，每个分到「总额度 ÷ 进程数」", "超过额度返回「请求太多」（HTTP 状态码 429）", "凭据格式、签名方式在开放 API 的 RFC（0017）里定"], "ref": "§4.3", "code": "backend/http/open/", "ws": "ws_auth", "shape": "gate"}, {"id": "A4", "z": "API", "kind": "machine", "icon": "🛡️", "name": "工具回调核验", "x": 930, "y": 700, "w": 460, "h": 260, "one": "Agent 调业务工具（如取数）时的回调。核验三步都通过才交给模块。", "steps": ["① 验签：用这个 DSH 进程专属的服务密钥核对签名，时间误差不超过 60 秒；再在回调防重放表里登记这次回调，同一次回调重复来就直接返回上次的结果", "② 向会话模块取执行凭据：这是谁的哪次执行、允许用哪些工具、额度还剩多少", "③ 把核验结果打包成「可信执行上下文」交给对应模块，模块不再自己核验", "原设计还有一步「等跟随器看到这次调用」，已去掉"], "ref": "§4.4", "code": "backend/http/tool/", "ws": "ws_auth", "shape": "gate3"}, {"id": "A5", "z": "API", "kind": "machine", "icon": "📏", "name": "非工具回调", "x": 930, "y": 1010, "w": 460, "h": 140, "one": "桥接插件的其他回调：每轮问剩余额度、登记「预算用完、暂停」。", "steps": ["验签、防重放和工具回调一样", "按 DSH 会话找到正在进行的那次执行（会话模块提供）", "来自发布探测进程的回调，改问发布模块"], "ref": "§4.4", "code": "backend/http/tool/", "ws": "ws_auth", "shape": "gate"}, {"id": "A6", "z": "API", "kind": "machine", "icon": "🎫", "name": "内部接口（评估）", "x": 930, "y": 1190, "w": 460, "h": 130, "one": "评估执行器用服务凭据调用。它不连数据库，由请求进程替它在任务表上领评估任务、续租约。", "ref": "§2.1", "code": "backend/http/internal/", "ws": "ws_auth", "shape": "gate"}, {"id": "A7", "z": "API", "kind": "machine", "icon": "📐", "name": "契约校验", "x": 1530, "y": 300, "w": 380, "h": 170, "one": "按事先约定的接口格式（OpenAPI 接口文档）检查请求，约定之外的字段一律拒绝。", "ref": "§4.1", "code": "backend/http/", "ws": "ws_out", "shape": "press"}, {"id": "A8", "z": "API", "kind": "machine", "icon": "📤", "name": "交给模块 · 打包响应", "x": 1530, "y": 560, "w": 380, "h": 210, "one": "把请求交给所属模块处理；把模块返回的结果或业务错误打包成统一格式的响应。", "steps": ["成功：把结果打包成响应（页面请求是 JSON，工具回调是 Agent 能看懂的工具结果）", "业务错误（找不到、没权限、冲突等）→ 对应的 HTTP 状态码和错误内容", "程序没预料到的错误一律返回 500，只带请求编号，方便查日志", "工具回调出错时，打包成 Agent 能看懂的工具错误"], "ref": "§4.5", "code": "backend/http/", "ws": "ws_out", "shape": "press"}, {"id": "S2", "z": "API", "kind": "machine", "icon": "⏱️", "name": "推送轮询", "x": 1520, "y": 920, "w": 250, "h": 180, "workers": 1, "show": 1, "one": "每 0.5 秒问一次会话模块：本进程正在推送的会话，最大序号变了没有；变了就读出新事件交给推送连接。", "ref": "§5.2", "code": "backend/http/stream/", "ws": "ws_push", "shape": "clock"}, {"id": "S1", "z": "API", "kind": "machine", "icon": "📻", "name": "浏览器推送连接（SSE）", "x": 1790, "y": 920, "w": 140, "h": 400, "one": "和浏览器之间一直开着的连接，服务器单向往浏览器推消息（SSE）。先补发断线期间漏掉的，再实时推。", "steps": ["空闲的连接不占线程（异步处理）", "每 15 秒发一次心跳，证明连接还活着；30 分钟主动断开一次，让浏览器重连", "断线续读：浏览器重连时带上最后收到的平台序号，从下一条接着推", "网关不支持长连接时，退为浏览器每秒来取一次"], "ref": "§5.2", "code": "backend/http/stream/", "ws": "ws_push", "shape": "tower"}, {"id": "S3", "z": "API", "kind": "machine", "icon": "📥", "name": "逐字增量接收", "x": 1520, "y": 1140, "w": 250, "h": 180, "one": "接收后台进程直接推来的模型逐字输出，转给推送连接；丢了不补（完整回答存库后会替换掉）。", "ref": "§5.2", "code": "backend/http/stream/", "ws": "ws_push", "shape": "inlet"}, {"id": "E1", "z": "API", "kind": "machine", "icon": "📮", "name": "事件投递", "x": 490, "y": 990, "w": 300, "h": 210, "workers": 4, "show": 4, "one": "本进程的事务一提交，就把其中发出的事件送给订阅它的模块。", "steps": ["在订阅方的事务里先往已处理事件表插一行；插不进去（已经有了）说明处理过，直接算成功", "要触发后台任务的事件：用事件编号当去重键建任务，重复触发也只建一个", "线程忙不过来时不等，留给后台进程每分钟重新提交"], "ref": "§3.3", "code": "backend/kernel/events/", "ws": "ws_evt1", "shape": "mailbox"}, {"id": "K1", "z": "API", "kind": "kernel", "icon": "⚙️", "name": "内核 · 共享连接池", "x": 480, "y": 1468, "w": 1440, "h": 110, "pipes": 20, "one": "框架给各模块的公共服务。每个请求进程一套，连接池 10–20 条。", "steps": ["数据库访问：开事务；模块只能用自己前缀的表", "发事件：和业务写入在同一个事务里登记", "防重复提交：先占位，再做事", "任务：提交、查询、取消", "常用工具：时钟、编号生成、日志、追踪编号、读密钥"], "ref": "§2.3、§2.5", "code": "backend/kernel/", "ws": "ws_ker1", "shape": "kernel"}, {"id": "N_ID", "z": "NB", "kind": "nb", "icon": "🪪", "name": "身份权限模块", "x": 2140, "y": 100, "w": 480, "h": 170, "one": "回答「这是谁」「能不能做」；停用账号、改角色时发变更通知。详细设计见 RFC-0006 和 0006 大图。", "ws": "", "shape": "house"}, {"id": "N_CONV", "z": "NB", "kind": "nb", "icon": "💭", "name": "会话模块（嘉敏）", "x": 2140, "y": 380, "w": 480, "h": 480, "one": "框架和它打交道最多：接收用户的提问、回答、审批（页面请求）并经 DSH 适配层发给 DSH；给工具回调核验执行凭据；把跟随器抄录的 DSH 事件存库、编号；回答推送轮询的「序号变了吗」；保管待决定事项和用户的回答；对账。它只存不推，推给浏览器的是推送轮询。", "steps": ["接收页面请求（提问、回答、审批）：先问身份模块判权、问发布模块要当前版本号，再在一个事务里写防重复记录、执行记录、消息、事件登记", "给工具回调核验、非工具回调提供执行凭据", "收跟随器交来的 DSH 事件：存库、编平台序号（按 DSH 序号去重）", "回答推送轮询：最大序号、新事件", "待决定事项：DSH 的提问存一行「等待回答」；张三回答后改成「已回答、待发送」给应答通道来取；问题已超时的，直接经 DSH 适配层回答", "对账任务：结果不明的执行，以及「已受理」超过 30 秒还没发出去的执行"], "ws": "", "shape": "house"}, {"id": "N_PUB", "z": "NB", "kind": "nb", "icon": "🏷️", "name": "Agent 配置与发布模块", "x": 2140, "y": 960, "w": 480, "h": 220, "one": "管 Agent 的配置、发布和版本。本图里：会话模块问它「这个 Agent 现在发布的是哪个版本」；它订阅「版本引用 +1 / −1」，数着每个版本有几个执行在用，不是当前版本且没人用才卸载。场景①「发布 Agent」也是它。", "ws": "", "shape": "house"}, {"id": "N_DATA", "z": "NB", "kind": "nb", "icon": "📊", "name": "数据访问模块", "x": 2140, "y": 960, "w": 480, "h": 220, "one": "取数工具的处理方：问身份模块要用户的取数身份（数仓账号 uid），调取数网关（平台外）拿数据，网关只返回这个人能看的；拿到数据后在一个事务里写防重复记录、发审计事件。", "ws": "", "shape": "house"}, {"id": "N_RES", "z": "NB", "kind": "nb", "icon": "🧩", "name": "资源库模块 · MCP 代理", "x": 2140, "y": 960, "w": 480, "h": 220, "one": "Agent 走 MCP 调外部工具（如查记忆）时，DSH 进程直接把请求发到这里，带着进程令牌，不经过请求入口。代理问身份模块「这是谁的进程」，放行后替它调外部服务。", "ws": "", "shape": "house"}, {"id": "N_FILE", "z": "NB", "kind": "nb", "icon": "🗂️", "name": "文件与产出模块", "x": 2140, "y": 960, "w": 480, "h": 220, "one": "保存 Agent 交出来的文件（图表、报告），登记成这次执行的产出，页面上才能展示和下载。经工具回调「登记产出」调用。", "ws": "", "shape": "house"}, {"id": "N_AUD", "z": "NB", "kind": "nb", "icon": "🔏", "name": "日志与审计模块", "x": 2140, "y": 960, "w": 480, "h": 220, "one": "记「谁、什么时候、做了什么」。订阅各模块发的审计事件，在自己的事务里先插已处理事件表、再存审计记录。别的模块不直接写它的表。", "ws": "", "shape": "house"}, {"id": "N_T04", "z": "NB", "kind": "nb", "icon": "🔁", "name": "DSH 适配层（闻洛）", "x": 2140, "y": 1280, "w": 480, "h": 180, "one": "把平台的调用翻译成 DSH 的网络请求和长连接；按用户找到他的 DSH 进程。", "ws": "", "shape": "house"}, {"id": "W1a", "z": "WK", "kind": "machine", "icon": "🏗️", "name": "普通执行池", "x": 2850, "y": 140, "w": 460, "h": 240, "workers": 8, "show": 8, "one": "一般的后台任务在这里跑。空闲时每秒去任务表领一批到期的任务，交给线程执行。", "steps": ["领的时候跳过别人正锁着的行，不排队等（数据库的 SKIP LOCKED 写法）", "同一个串行键（比如同一个 Agent 的发布）同时只跑一个，按提交先后排队", "领一次，尝试次数加一；租约 60 秒", "每个后台进程最多同时跑 8 个；2 个后台进程共 16 个"], "ref": "§3.4", "code": "apps/platform-worker/", "ws": "ws_claim", "shape": "bench"}, {"id": "W1b", "z": "WK", "kind": "machine", "icon": "🏗️", "name": "后台执行池", "x": 2850, "y": 420, "w": 460, "h": 150, "workers": 2, "show": 2, "one": "自进化、评估这类又慢又多的任务。单独一个池，评估再多也挤不掉普通任务。", "ref": "§3.4", "code": "apps/platform-worker/", "ws": "ws_claim", "shape": "bench"}, {"id": "W1c", "z": "WK", "kind": "machine", "icon": "🏗️", "name": "长任务执行池", "x": 2850, "y": 610, "w": 460, "h": 170, "workers": "N", "show": 4, "one": "跟随器、应答通道这类一跑很久的任务。大部分时间在等 DSH 的消息，不独占线程；失败了不限次数重来。同时持有的上限 = DSH 进程数上限 × 2。", "ref": "§3.4、§6.4", "code": "apps/platform-worker/", "ws": "ws_claim", "shape": "bench"}, {"id": "W9", "z": "WK", "kind": "machine", "icon": "🔩", "name": "任务处理器", "x": 3450, "y": 140, "w": 340, "h": 180, "one": "各模块登记的处理函数，真正干活的地方（发布、评估、清理工作区…）。", "steps": ["必须能重复执行不出错（幂等）：租约被收回后，同一个任务可能再跑一次", "写结果时核对代次：已经被别人接手的话，旧的写不进去", "取消不是强行打断：续租时看到取消标记，处理函数自己找安全的地方收尾"], "ref": "§3.4", "ws": "ws_run", "shape": "press"}, {"id": "W2", "z": "WK", "kind": "machine", "icon": "🔁", "name": "续租与收回", "x": 3930, "y": 140, "w": 380, "h": 190, "workers": 2, "show": 2, "one": "正在跑的任务每 20 秒续一次租约；另外每 10 秒把租约过期（持有者可能挂了）的任务退回排队，重试次数用完的标为「放弃」并告警。", "steps": ["续租时一行都没改到 = 已经被别人接手，立刻停手", "应答通道续租失败，立刻关掉和 DSH 的连接，避免两个后台进程同时应答"], "ref": "§3.4", "code": "apps/platform-worker/", "ws": "ws_sched", "shape": "clock"}, {"id": "W3", "z": "WK", "kind": "machine", "icon": "⏰", "name": "定时调度", "x": 3930, "y": 370, "w": 380, "h": 190, "one": "每秒检查各模块登记的定时规则（按北京时间），到点就往任务表插一条任务。两个后台进程都会插，但去重键「规则名 + 计划时间」唯一，只进得去一条，所以 const TOURS=[{"id": "full", "name": "⓪ 完整例子：一次提问全流程", "steps": [{"b": ["b_br", "s_a2", "k_a2", "k_a2r"], "m": ["G_BROWSER", "A1", "A2", "N_ID", "A_POOL"], "t": "【请求】张三在页面上问「上个月华东区贷款余额是多少，画个图」。页面同时生成一个防重复编号放进请求头（重发时带同一个）。请求分路编号，按 /api/v1 开头送到网页认证：带登录 cookie 问身份模块「这是谁」→ 答「张三」（缓存 30 秒）；写请求还要核对防跨站令牌。\n🔒 只读，没有事务。"}, {"b": ["v_a2", "v_a8", "d_conv", "k_conv", "k_convr", "c_ver", "c_verr"], "m": ["A7", "A8", "N_CONV", "N_ID", "N_PUB"], "t": "【请求 → 会话模块】契约校验按接口约定检查格式，交给会话模块。框架只认人、不判权限，所以会话模块自己去问【调用】：问身份模块「张三能不能对话」→ ✅；问 Agent 配置与发布模块「这个 Agent 现在发布的是哪个版本」→ 版本号。\n🔒 只读，还没开事务。"}, {"b": ["c_idem", "c_store", "c_ep"], "m": ["N_CONV", "K1", "T_IDEM", "T_BCONV", "T_EP"], "t": "会话模块开一个事务：① 防重复提交表插一行（命令「会话.发起提问」+ 页面给的编号 + 请求指纹，结果先空着）② 写执行记录 exe_123「已受理」和张三的消息（序号 41）③ 登记两个事件：「执行已受理」（给框架建跟随任务）、「版本引用 +1」（给发布模块）④ 填上结果，提交。\n🔒 ①②③④ 是一个事务：一起生效，或一起不算。\n💥 提交前任何一步失败：整个回滚、页面报错，等于没发生；张三重发即可（带同一个编号也安全）。"}, {"b": ["d_convr", "d_resp", "c_send", "t_dsh", "p_sse"], "m": ["N_CONV", "N_T04", "DSH", "A8", "G_BROWSER", "S1"], "t": "提交之后（不在事务里：规矩是事务里不调外部系统），会话模块经 DSH 适配层把消息发给张三的 DSH 进程，带请求编号，DSH 收下就返回。浏览器收到「已受理」，打开推送连接等新消息。\n💥 提交后、发出前进程崩了：会话模块的对账任务发现「已受理」超过 30 秒，按请求编号问 DSH，没收到才重发。"}, {"b": ["e_api", "e_job", "e_sub", "e_inb", "e_cur1", "m_biz"], "m": ["T_EP", "E1", "T_JOBS", "N_PUB", "T_INBOX", "T_CUR", "T_BAGT"], "t": "【事件】第 3 步的事务一提交，请求进程的事件投递（框架的能力，不是模块）把登记的两个事件交给各自的订阅方：「执行已受理」→ 框架的监听器在任务表建一个跟随任务（事件编号作去重键，长任务池）；「版本引用 +1」→ 发布模块记下「这个 Agent 版本多了一个执行在用」，免得旧版本被卸载；有序进度表保证 +1 先于 −1 处理。\n🔒 建任务一个事务；发布模块：已处理事件表 + 有序进度表 + 计数 +1，一个事务。\n💥 投递失败或进程崩了：登记行没标完成，后台进程每分钟重新提交；去重键、已处理事件表挡住重复。"}, {"b": ["j_c", "l_f", "f_seq", "f_seqr", "f_t04", "f_t04r", "t_dsh", "t_dshr"], "m": ["T_JOBS", "W1c", "W6", "K2", "N_CONV", "N_T04", "DSH"], "t": "【任务】后台进程的长任务执行池每秒领一次，领到跟随任务：改成运行中、代次 1、租约 60 秒（之后每 20 秒续一次）。跟随器先问会话模块「上次处理到 DSH 第几号」，再经 DSH 适配层订阅张三这个会话的输出。\n🔒 领任务是一个小事务（锁行 + 改状态）。\n💥 后台进程崩了：60 秒后租约过期，另一个后台进程领走，从记下的序号接着跟。"}, {"b": ["b_brg", "s_a5", "r_cb5", "k_a5", "k_a5r", "v_a5", "v_a8", "d_cbresp"], "m": ["G_BRIDGE", "A1", "A5", "T_CB", "N_CONV", "A7", "A8"], "t": "【请求 · 非工具回调】Agent 开始这一轮，桥接插件先问「还剩多少额度」（/internal/exec/v1）：验签、记防重放，问会话模块「这个 DSH 会话正在进行的执行和限额」，把限额回给插件。\n🔒 防重放那一行是单独的小事务。"}, {"b": ["t_dshr", "f_t04r", "f_conv", "c_store"], "m": ["DSH", "N_T04", "W6", "N_CONV", "T_BCONV"], "t": "【调用】DSH 开始输出。跟随器（只看不答）每收到一批，就交给会话模块：存进会话事件表、编平台序号 42、43…\n🔒 每批：存事件 + 更新执行状态，会话模块一个事务；按 DSH 序号去重，重复交来不会存两遍。"}, {"b": ["p_look", "p_lookr", "p_new", "p_out"], "m": ["S2", "N_CONV", "S1", "G_BROWSER"], "t": "会话模块自己不推送：请求进程的推送轮询每 0.5 秒问它「最大序号变了吗」，变了就读出新事件，经推送连接发给浏览器。\n🔒 只读。"}, {"b": ["b_dshcb", "b_brg", "s_a4", "r_dshp", "r_dshpr", "r_cb"], "m": ["DSH", "G_BRIDGE", "A1", "A4", "T_DSHP", "T_CB"], "t": "【请求 · 工具回调】Agent 调「取数」工具。桥接插件带「DSH 会话编号 + 调用编号 + 签名」回调 /internal/tool/v1。核验第 1 步：按连接编号在 DSH 进程登记表查到服务密钥、验签（时间戳 ±60 秒），在回调防重放表插一行「处理中」。\n🔒 插「处理中」是单独的小事务，马上提交，让重试立刻看得到。\n💥 之后任何地方崩了：插件超时重试，看到「处理中」超过 60 秒没更新，就接手重做。"}, {"b": ["k_a4", "k_a4r", "v_a4", "v_a8", "d_data", "k_data", "k_datar"], "m": ["A4", "N_CONV", "A7", "A8", "N_DATA", "N_ID"], "t": "第 2 步：核验问会话模块「这个 DSH 会话在跑哪次执行」→ 拿回执行凭据（张三、允许的工具、限额），没有进行中的执行就拒绝。第 3 步：构造可信执行上下文 → 契约校验 → 交给数据访问模块。数据访问模块问身份模块「张三的取数身份」→ 数仓账号 uid，再调取数网关（图外），网关只返回张三能看的数据。（另有一步「核对 Agent 是否真调了这个工具」，去留待定。）\n🔒 都是只读；调网关不在任何事务里。"}, {"b": ["n_idem", "n_ep", "d_datar", "r_cb", "d_cbresp"], "m": ["N_DATA", "T_IDEM", "T_EP", "A8", "T_CB", "G_BRIDGE"], "t": "数据访问模块拿到数据后开一个短事务：防重复记录（键 = DSH 会话:调用编号:第几次回调，存下结果）+ 登记审计事件，提交。结果交回「交给模块 · 打包响应」，打包成工具结果回给桥接插件；框架把防重放那行改「完成」并存下结果。\n🔒 两个事务：数据访问模块（防重复记录 + 审计事件）；框架（防重放改「完成」）。\n💥 改「完成」之前崩了：重试接手重做，撞上防重复记录直接拿回结果，审计不会记两条。"}, {"b": ["e_api", "e_aud", "e_inb", "a_biz"], "m": ["T_EP", "E1", "N_AUD", "T_INBOX", "T_BAUD"], "t": "【事件】数据访问模块的事务一提交，事件投递把审计事件交给审计模块的订阅处理：先插已处理事件表（插不进去说明处理过了），再存审计记录。\n🔒 审计模块一个事务：已处理事件表 + 审计记录。\n💥 投递失败：登记行没标完成，后台每分钟重新提交，已处理事件表挡住重复。"}, {"b": ["mcp", "k_res", "k_resr", "mcpr"], "m": ["DSH", "N_RES", "N_ID"], "t": "【不经请求入口】Agent 查记忆走 MCP：DSH 进程直接把请求发给资源库模块的 MCP 代理，带着进程令牌（在 DSH 进程的环境变量里）。代理拿令牌问身份模块「这是谁的进程」→「张三的」→ 放行，替它调外部服务，结果回给 DSH。进程令牌只认到「张三的进程」，执行凭据能认到「哪次执行」。\n🔒 只读。"}, {"b": ["t_dshr", "f_t04r", "f_conv", "q_in", "a_conv", "c_store"], "m": ["DSH", "N_T04", "W6", "W7", "N_CONV", "T_BCONV"], "t": "Agent 问张三「余额按月末还是日均？」（限时 30 秒）。同一个问题从两条路进来：跟随器抄录到「Agent 调了提问工具」（只看不答）；应答通道从专门的连接收到提问（以后要用这条连接回答）。两边都交给会话模块，按调用编号去重：先到的在待决定事项里插一行「等待回答」（序号 50），后到的只补上回答要用的编号。\n🔒 会话模块：待决定事项 + 会话事件，一个事务。"}, {"b": ["p_look", "p_lookr", "p_new", "p_out"], "m": ["S2", "N_CONV", "S1", "G_BROWSER"], "t": "和第 9 步同一条路：推送轮询发现新序号 50，读出这个问题，推给浏览器，页面上出现「月末 / 日均」两个按钮。\n🔒 只读。"}, {"b": ["b_br", "s_a2", "v_a2", "v_a8", "d_conv", "c_store", "d_convr", "d_resp"], "m": ["G_BROWSER", "A1", "A2", "A7", "A8", "N_CONV", "T_BCONV"], "t": "【请求】张三点「月末」。这照样是一个页面请求：请求分路 → 网页认证 → 契约校验 → 会话模块。会话模块把第 15 步插的那一行改成「已回答、待发送」。浏览器从不直接碰 DSH。若张三超过 30 秒才答，DSH 已经不等了：会话模块改为直接经 DSH 适配层调「回答问题」接口，不用应答通道。\n🔒 防重复记录 + 改这一行，会话模块一个事务。"}, {"b": ["l_a", "a_poll", "a_pollr", "a_t04", "t_dsh"], "m": ["W1c", "W7", "N_CONV", "N_T04", "DSH"], "t": "【任务里的调用】回答出去的路：持有应答通道的长任务每秒问会话模块「我管的进程有没有待发送的回答」→ 拿到「月末」→ 确认自己仍是持有者（代次没变）→ 用收到问题的那条连接回给 DSH → 告诉会话模块「已发送」。随后跟随器抄录到提问工具的结果是「月末」，核对无误。\n💥 发出时 DSH 刚好超时（回复也返回成功，但不生效）：核对时发现结果是「待回答」，改用「回答问题」接口再答一次（只能答一次，不会答两遍）。"}, {"b": ["b_dshcb", "b_brg", "s_a4", "k_a4", "k_a4r", "v_a4", "v_a8", "d_file", "fl_biz", "d_filer", "d_cbresp"], "m": ["DSH", "G_BRIDGE", "A4", "N_CONV", "A8", "N_FILE", "T_BFILE"], "t": "【请求 · 工具回调】Agent 在 DSH 里画好图（这部分在 DSH 内部，图上看不见），调文件与产出模块的「登记产出」工具：同样的三步核验，交给文件与产出模块存下文件、登记成这次执行的产出，页面才能展示和下载。大文件可能分几次回调。（工具名、文件怎么传，由文件与产出模块的 RFC 定。）\n🔒 文件与产出模块：防重复记录 + 文件记录，一个事务。"}, {"b": ["f_tok", "f_push", "p_tok", "p_out", "p_sse"], "m": ["W6", "W10", "S3", "S1", "G_BROWSER"], "t": "模型逐字写回答：跟随器每 100 毫秒攒一批，直接发给请求进程的逐字增量接收，再推给浏览器（不存库、没有序号，丢了不补）。张三网断 5 秒，重连时带上最后的序号，推送连接先补发漏掉的事件，完整回答替换掉半截文字。\n🔒 逐字输出不存库，没有事务。"}, {"b": ["f_conv", "c_store", "c_ep", "e_wk", "e_sub2", "e_inb2", "e_cur", "m_biz", "f_done"], "m": ["W6", "N_CONV", "T_BCONV", "T_EP", "W8", "N_PUB", "T_INBOX", "T_CUR", "T_BAGT", "T_JOBS"], "t": "DSH 本轮结束。跟随器把「本轮结束」交给会话模块：存下事件、执行改「已完成」（写终态），同一事务登记「版本引用 −1」。这个事务在后台进程里提交，所以由后台进程的事件投递送给发布模块：有序进度表核对 2 号在 1 号之后，计数 −1。跟随器退出，任务表写「成功」（核对代次）。应答通道不结束：它跟着 DSH 进程。\n🔒 三个事务：会话模块（终态 + 登记 −1）；发布模块（已处理事件 + 有序进度 + 计数 −1）；框架（任务写「成功」）。\n💥 写「成功」之前崩了：租约过期，别的后台进程接手，读到本轮已结束，直接收尾。"}, {"b": ["j_lease", "e_resub", "j_cron", "c_all"], "m": ["W2", "W4", "W3", "W5", "T_JOBS", "T_EP"], "t": "整个过程中后台一直在兜底：每 10 秒收回过期租约（后台进程崩了，跟随任务 60 秒内被另一个后台进程接手，从记下的 DSH 序号接着跟）；每分钟把超过 1 分钟没处理完的事件重新提交；定时任务到点插任务、按保留期分批清理。"}]}, {"id": "web", "name": "① 一个页面请求", "steps": [{"b": ["b_br"], "m": ["G_BROWSER", "A1", "A_POOL"], "t": "张三点了「发布 Agent」。请求进入请求进程；请求分路给它编上请求编号，按网址开头送到网页认证。"}, {"b": ["s_a2", "k_a2", "k_a2r"], "m": ["A2", "N_ID"], "t": "网页认证：按登录 cookie 查身份缓存（30 秒）；缓存里没有，就问身份权限模块「这是谁」。写操作还要核对防跨站的令牌。"}, {"b": ["v_a2", "v_a8"], "m": ["A7", "A8"], "t": "按事先约定的接口格式检查请求内容，再交给所属模块。框架只认人、不判权限：「张三能不能发布」由发布模块自己判断。"}, {"b": ["d_pub", "k_pub", "k_pubr", "m_idem", "m_biz", "m_ep"], "m": ["N_PUB", "N_ID", "K1", "T_IDEM", "T_BAGT", "T_EP"], "t": "发布模块先问身份模块「张三能不能发布」→ ✅。然后在一个事务里做三件事：防重复提交表先占位 → 写业务表 → 发事件（事件登记表插一行）。\n🔒 三件事一个事务：一起生效，或一起不算。"}, {"b": ["d_pubr", "d_resp"], "m": ["A8", "G_BROWSER"], "t": "结果或业务错误交回「交给模块 · 打包响应」，转成统一格式的响应返回浏览器。如果张三双击了两次，第二个请求会等第一个提交，然后直接拿到同样的结果。"}]}, {"id": "cb", "name": "② 一次工具回调", "steps": [{"b": ["b_dshcb", "b_brg"], "m": ["DSH", "G_BRIDGE", "A1"], "t": "张三的 Agent 在 DSH 里调用「取数」工具。桥接插件带着 DSH 会话编号、调用编号和签名回调平台。"}, {"b": ["s_a4", "r_dshp", "r_dshpr", "r_cb"], "m": ["A4", "T_DSHP", "T_CB"], "t": "① 验签：按连接编号查到这个 DSH 进程的服务密钥，核对签名和时间；再在回调防重放表插一行「处理中」。同一次回调重复来，直接返回上次结果。"}, {"b": ["k_a4", "k_a4r"], "m": ["A4", "N_CONV"], "t": "② 向会话模块取执行凭据：这是张三的哪次执行、允许用哪些工具、额度还剩多少。这个会话没有进行中的执行，就拒绝。"}, {"b": ["v_a4", "v_a8", "d_data"], "m": ["A7", "A8", "N_DATA"], "t": "③ 打包成「可信执行上下文」交给数据访问模块。数据访问模块只认这个上下文，不再自己核验。"}, {"b": ["d_datar", "r_cb", "d_cbresp"], "m": ["A8", "T_CB", "G_BRIDGE"], "t": "取数完成：结果经「交给模块 · 打包响应」变成工具结果；回调防重放表写「完成」和结果，工具结果返回给 Agent。如果处理到一半进程挂了，60 秒后的重试可以接手重做，模块的防重复提交记录保证不会重复写。"}]}, {"id": "evt", "name": "③ 一个事件从发出到处理", "steps": [{"b": ["m_biz", "m_ep"], "m": ["N_PUB", "T_BAGT", "T_EP"], "t": "以发布模块为例：它在业务事务里发事件，业务写入和事件登记（每个订阅方一行）在同一个事务里提交。事务回滚，事件也就不存在。"}, {"b": ["e_api"], "m": ["T_EP", "E1"], "t": "提交后，本进程的事件投递马上把事件送出去（目标 1 秒内）。"}, {"b": ["e_inb", "e_aud"], "m": ["E1", "T_INBOX", "N_AUD"], "t": "以审计模块订阅为例：在订阅方的事务里先往已处理事件表插一行，插不进去说明处理过了，直接算成功；否则交给订阅方处理。事件至少送一次，再按事件编号去重，效果上每条只处理一次。"}, {"b": ["e_job"], "m": ["E1", "T_JOBS"], "t": "如果这个事件要触发后台任务（比如建跟随任务），就用事件编号当去重键插入任务表，重复触发也只建一个。"}, {"b": ["e_resub", "e_wk", "e_cur"], "m": ["W4", "T_EP", "W8", "T_CUR"], "t": "投递失败或进程崩了：后台进程每分钟把超过 1 分钟还没送达的事件重新提交。有顺序要求的事件（版本引用变更）用有序进度表保证先处理 1 号、再处理 2 号。"}]}, {"id": "job", "name": "④ 一个任务从建立到结束", "steps": [{"b": ["e_job2", "j_cron"], "m": ["W8", "W3", "T_JOBS"], "t": "任务有两个来源：事件触发（用事件编号去重）和定时调度（用「规则名 + 计划时间」去重）。插入时撞上去重键，说明已经建过了。"}, {"b": ["j_a"], "m": ["T_JOBS", "W1a"], "t": "普通执行池每秒去任务表领一批：别人正锁着的行直接跳过；同一个串行键已有任务在跑的不领，同键有更早排队的也不领。领的时候尝试次数加一，租约 60 秒。"}, {"b": ["j_run"], "m": ["W1a", "W9"], "t": "执行池把任务交给模块登记的处理函数执行（每个后台进程的普通执行池最多同时 8 个）。"}, {"b": ["j_lease"], "m": ["W2", "T_JOBS"], "t": "执行期间每 20 秒续一次租约，续租时核对代次。一行都没改到，说明租约已被收回、别人接手了，立刻停手。"}, {"b": ["j_done"], "m": ["W9", "T_JOBS"], "t": "做完写结果、改成「成功」（同样核对代次）。如果后台进程中途挂了：续租与收回每 10 秒把租约过期的任务退回排队，另一个后台进程领走重做——所以处理函数必须能重复执行不出错。"}]}, {"id": "tok", "name": "⑤ 逐字回答怎么到浏览器", "steps": [{"b": ["c_send", "t_dsh", "c_ep"], "m": ["N_CONV", "N_T04", "DSH", "T_EP"], "t": "会话模块受理张三的问题，经 DSH 适配层发给 DSH，同时发出「执行已受理」事件（和执行记录同一个事务登记）。"}, {"b": ["e_job", "j_c", "l_f"], "m": ["T_JOBS", "W1c", "W6"], "t": "这个事件触发建一个跟随任务，长任务执行池领走，变成一个 DSH 跟随器（它大部分时间在等消息，不占线程）。"}, {"b": ["f_t04", "f_t04r", "f_conv", "c_store"], "m": ["W6", "N_T04", "N_CONV", "T_BCONV"], "t": "跟随器订阅 DSH 的输出（只看不答），每批事件交给会话模块：存进会话事件表、编上平台序号。"}, {"b": ["p_sse", "p_look", "p_lookr", "p_new", "p_out"], "m": ["G_BROWSER", "S1", "S2", "N_CONV"], "t": "浏览器开着推送连接。推送轮询每 0.5 秒问会话模块一次最大序号，有新事件就读出来，经推送连接推给浏览器。会话模块只存不推。"}, {"b": ["f_tok", "f_push", "p_tok", "p_out"], "m": ["W6", "W10", "S3", "S1", "G_BROWSER"], "t": "模型的逐字输出不存库：跟随器每 100 毫秒攒一批，直接推给请求进程，再经推送连接立刻推给浏览器。完整回答存库后，会替换掉逐字拼出来的文字。"}]}, {"id": "one", "name": "⑥ 只能一个实例做的事", "steps": [{"b": ["j_cron"], "m": ["W3", "T_JOBS"], "t": "定时任务：两个后台进程的定时调度到点都会插「清理任务 · 03:00」，但去重键唯一，只有一条进得去——所以不需要选一个主进程。"}, {"b": ["j_c", "l_a"], "m": ["T_JOBS", "W1c", "W7"], "t": "应答通道：每个 DSH 进程一个长任务，租约保证同一时刻只有一个后台进程持有。持有者挂了，租约过期，另一个后台进程接手重连。"}, {"b": ["a_poll", "a_pollr"], "m": ["W7", "N_CONV"], "t": "张三在页面上回答了 Agent 的提问，会话模块把它标成「已回答、待发送」。持有通道的那个应答通道每秒来问一次，把回答取走。"}, {"b": ["a_t04", "t_dsh"], "m": ["W7", "N_T04", "DSH"], "t": "用同一条连接回复 DSH。发出后核对：如果 DSH 已经等超时了（30 秒），改用普通接口再答一次。"}]}];
// 名词解释：图里出现、需要解释的词。新出现一个就加一条
const GLOSSARY=[
["进程","一个正在运行的程序。平台后端有两种：请求进程和后台进程。"],
["请求进程（API 进程）","程序名 platform-api。接住所有外部请求（浏览器、接入应用、DSH 回调、评估执行器），处理完马上返回；也负责往浏览器推消息。可以部署多个。"],
["后台进程（Worker）","程序名 platform-worker。不接外部请求，只在后台干活：跑任务、盯 DSH 输出、应答 DSH 的提问、定时清理。建议部署 2 个。"],
["副本","同一种进程部署了好几份，比如 2 个后台进程。它们代码一样，靠数据库里的租约、去重键协调，不会重复干活。"],
["线程","进程里同时干活的单位。一个线程同一时刻只做一件事；线程有上限，所以长时间等待的事尽量不占线程。"],
["连接池","进程预先和数据库建好的一批连接，谁要查库就借一条，用完马上还。条数看「同一时刻有多少查询在跑」，和用户数无关。"],
["事务","一组数据库操作，要么全部生效，要么全部不算。规定事务里不许调外部系统，否则外部一慢，连接就被一直占着。"],
["内核","框架给各模块的公共服务：数据库访问、发事件、防重复提交、任务、时钟编号日志密钥等。每个进程一套。"],
["模块 / 模块清单","平台按业务分成多个模块（会话、身份权限、取数……）。每个模块用一份清单声明自己的接口、订阅的事件、任务处理函数、定时规则，启动时框架照清单装配和检查。"],
["表名前缀","全平台只有一个库，各模块的表靠前缀区分：platform_ 是框架的，identity_ 是身份权限的，conversations_ 是会话的……模块只能用自己前缀的表。"],
["事件 / 订阅方","模块告诉别人「某件事发生了」的一条消息，比如「执行已受理」。关心这件事的模块叫订阅方。"],
["事件登记","发事件时在事件登记表里插一行，和业务写入在同一个事务里。业务写入成功，事件就一定在；回滚了，事件也不存在。"],
["至少送一次 + 去重","事件可能被送多次（重试、重新提交），订阅方用已处理事件表按事件编号去重，效果上每条只处理一次。"],
["有序订阅","少数订阅要求同一对象的事件按顺序处理（目前只有发布模块订阅「版本引用变更」），用有序进度表保证。"],
["任务 / 任务表","要在后台做的一件事，比如发布 Agent、跑评估、跟随 DSH 会话。全部记在任务表里，后台进程去领。"],
["执行池","后台进程里按任务种类分开的几组线程：普通（8）、后台（2，自进化和评估）、长任务（跟随器、应答通道）。分开是为了评估再多也不挤掉普通任务。数字是每个后台进程的。"],
["租约","领任务时约定的有效期（60 秒）。持有者每 20 秒续一次；不续了（比如进程挂了），到期后任务退回排队，别人可以接手。"],
["代次","任务每被领一次加一。续租、写结果时核对代次：已经被别人接手的旧持有者，写不进去。"],
["去重键","同一件事用同一个键，表上唯一，第二次插入会失败，所以只建一个任务。例：定时任务用「规则名 + 计划时间」。"],
["串行键","同一个键的任务一次只跑一个，按提交先后排队。例：同一个 Agent 的发布用「agent-publish:Agent 编号」。"],
["放弃（死信）","重试次数用完还失败的任务，状态标为放弃（dead），会告警，等人处理。"],
["取消标记","运行中的任务不能强行打断，只置一个标记；处理函数续租时看到它，自己找安全的地方收尾。"],
["幂等","同一件事做一次和做多次结果一样。任务处理函数、工具回调都要求幂等，因为可能被重做。"],
["防重复提交","用户双击、网络重试时，同一个操作可能来两次。业务事务第一句先在防重复提交表占位，第二个请求会等第一个结束后直接拿到同样的结果。"],
["防重放","同一次回调被重复发来时，不重复处理，直接返回上次的结果。"],
["签名 / 验签","发送方用密钥给请求算一个签名，平台用同一把密钥核对，确认请求真是它发的、内容没被改过。每个 DSH 进程有一把专属的服务密钥。"],
["执行凭据","会话模块给出的「这次工具调用属于谁的哪次执行、允许用哪些工具、额度还剩多少」。"],
["可信执行上下文","工具回调核验通过后打包给模块的信息（是谁、哪次执行、能用什么）。模块只认它，不再自己核验。"],
["契约 / 接口文档（OpenAPI）","事先约定好的接口格式。契约校验就是检查请求是否符合约定，约定外的字段一律拒绝。"],
["业务错误","业务上的失败，比如找不到、没权限、冲突，区别于程序出错。「交给模块 · 打包响应」把它们转成统一格式的响应。"],
["cookie / 防跨站伪造","cookie 是浏览器替网站保存的小段数据，登录状态就存在里面。防跨站伪造：防止别的网站借用户的登录状态偷偷发请求。"],
["限流","限制每个接入应用单位时间内的调用次数，超了返回「请求太多」。"],
["推送连接（SSE）","浏览器和平台之间一直开着的连接，平台可以随时往浏览器推消息（单向）。"],
["平台序号","会话模块给每个存库的会话事件编的递增号码。浏览器断线重连时报上最后收到的序号，平台从下一条接着推（断线续读）。"],
["心跳","每隔一段时间发一条空消息，证明连接还活着，免得被网关当成空闲连接断掉。"],
["逐字输出","模型一个字一个字地吐出回答。这部分不存库，直接推给浏览器；完整回答存库后替换掉。"],
["DSH / DSH 进程 / DSH 会话","DSH 是 Agent 运行的系统。每个用户一个 DSH 进程；用户的一次对话在 DSH 里是一个会话。"],
["桥接插件","装在 DSH 里的插件。Agent 要用平台的业务工具时，由它回调平台。"],
["跟随器","每个进行中的 DSH 会话一个长任务，盯着 DSH 的输出，交给会话模块存库。"],
["应答通道","Agent 向用户提问或请求审批时，DSH 经一条专门的连接等回答。每个 DSH 进程一条，由一个后台进程持有。"],
["评估执行器","跑评估的 Python 程序，不连数据库，只调平台内部接口。"],
["SKIP LOCKED","数据库的一种写法：领任务时跳过别人正锁着的行，不排队等。多个后台进程同时领任务时不会互相卡住。"],
["定时规则（cron）","「每天 3 点」这类定时规则的标准写法，各模块在清单里登记。"],
["Spring Modulith","框架用的一个开源库，负责模块边界检查和事件登记、投递。事件登记表就是它自带的。"],
["版本引用","会话模块在执行受理时发「版本引用 +1」、结束时发「−1」，发布模块据此数每个 Agent 版本有几个执行在用；不是当前版本且没人用，才卸载旧版本。和用户发布什么无关。"],

window.addEventListener('pointerup',()=>{ if(drag&&drag.moved) stage.dataset.dragged='1'; drag=null; stage.classList.remove('grab'); });
document.addEventListener('click',e=>{ if(stage.dataset.dragged){ delete stage.dataset.dragged; return; } const t=e.target;
  const li=t.closest('li[data-belt]'); if(li){ if(st.tour) return; st.sel=null; st.selBelt=li.dataset.belt; showBelt(st.selBelt); applyHL(); return; }
  const n=t.closest('.node'); if(n){ if(st.tour) return; st.selBelt=null; st.sel=n.dataset.node; showNode(st.sel); applyHL(); return; }
  const b=t.closest('.belt,.blab'); if(b){ if(st.tour) return; st.sel=null; st.selBelt=b.dataset.belt; showBelt(st.selBelt); applyHL(); return; }
  if(t.closest('#svg')&&!st.tour){ st.sel=null; st.selBelt=null; applyHL(); } });
stage.addEventListener('dblclick',e=>{ const n=e.target.closest('.node'); if(n) zoomTo([n.dataset.node]); });
$('#gall').onclick=()=>animVB(boxFit(WORLD.x,WORLD.y,WORLD.x+WORLD.w,WORLD.y+WORLD.h,1));
$('#bgl').onclick=()=>{ document.body.classList.remove('nopanel'); $('#panel').innerHTML='<h2>名词解释</h2><dl class="gl">'+GLOSSARY.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')+'</dl>'; $('#panel').scrollTop=0; };
$('#gapi').onclick=()=>goRegion('GATE','API'); $('#gtop').onclick=()=>goRegion('NB','DSHR'); $('#gdb').onclick=()=>goRegion('DBZ'); $('#gwk').onclick=()=>goRegion('WK');
$('#bpanel').onclick=()=>{ document.body.classList.toggle('nopanel'); $('#bpanel').textContent=document.body.classList.contains('nopanel')?'显示右侧面板':'隐藏右侧面板'; };
$('#tour').innerHTML='<option value="">▶ 走一遍…</option>'+TOURS.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
function tourGo(){ const t=TOURS.find(x=>x.id===st.tour), s=t.steps[st.step]; $('#tourbar').style.display='flex'; document.body.classList.add('touring');
  $('#ttxt').innerHTML=`<b>${esc(t.name)}</b>　第 ${st.step+1} / ${t.steps.length} 步<br>${esc(s.t).replace(/\n/g,'<br>')}`; $('#tp').disabled=st.step===0; $('#tn').disabled=st.step===t.steps.length-1;
  st.sel=null; st.selBelt=null; applyHL(); const f=focus(); zoomTo([...f.n]); const main=s.m.find(id=>MM[id]&&MM[id].z!=='DBZ')||s.m.find(id=>MM[id]); if(main) showNode(main); }
$('#tour').onchange=e=>{ if(!e.target.value) return endTour(); st.tour=e.target.value; st.step=0; tourGo(); };
function endTour(){ st.tour=null; document.body.classList.remove('touring'); $('#tourbar').style.display='none'; $('#tour').value=''; applyHL(); }
$('#tp').onclick=()=>{ st.step--; tourGo(); }; $('#tn').onclick=()=>{ st.step++; tourGo(); }; $('#tx').onclick=endTour;
document.addEventListener('keydown',e=>{ if(!st.tour) return; if(e.key==='ArrowRight'&&!$('#tn').disabled){st.step++;tourGo();} if(e.key==='ArrowLeft'&&!$('#tp').disabled){st.step--;tourGo();} if(e.key==='Escape') endTour(); });
const usedIt=new Set(BB.map(b=>b[3]));
$('#legend').innerHTML='<b>连线</b>　<span>⋯ 点点线：发起的一方去问、递过去</span><span>— 实线：答案回来、或送出的东西</span><span>两条挨着的线 = 一问一答</span><br><b>线上传的内容</b>　'+Object.entries(ITEMS).filter(([k])=>usedIt.has(k)).map(([k,i])=>i).map(i=>`<span><i style="border-color:${i.c}">${i.e}</i>${esc(i.n)}</span>`).join('');
$('#panel').innerHTML=`<h2>RFC-0004 后端框架</h2><ul>
<li><b>两个进程</b>：平台后端是两个程序。<b>请求进程</b>（蓝框，程序名 platform-api）接住所有外部请求，处理完马上返回；<b>后台进程</b>（绿框，程序名 platform-worker）不接请求，只在后台跑任务、盯 DSH、定时清理。框后面的叠影表示可以部署多个（后台进程部署 2 个）。</li>
<li><b>布局</b>：最上面一排是其他模块（只画和框架对接的地方）和 DSH；中间从左到右是外部入口 → 请求进程 → 数据库 → 后台进程。数据库夹在两个进程中间，左半是请求进程用的表，右半是后台进程用的表。</li>
<li><b>内核</b>是两个进程里贴着数据库的紫色竖条：框架给各模块的公共服务。紫色粗管道是共享连接池，铭牌上的条数是<b>每个进程</b>的。</li>
<li><b>外形</b>：岗亭（带黄黑栏杆）是认证；道岔是请求分路；表盘是定时类；天线塔是浏览器推送连接；托盘上的刻度是执行池的并发上限；叠在一起的卡片表示有很多个（每个会话 / 每个 DSH 进程一个）；圆柱是表，列的中文名后面灰色的是列名。</li>
<li><b>连线</b>：箭头指向接收的一方。<b>点点线</b>是发起的一方去问（线上的小图标是递过去的东西，什么都不递就是 ❓）；<b>实线</b>是答案回来，或单向送出的东西。两条挨着的线就是一问一答，比如网页认证带 🍪 去问身份模块，身份模块回 🪪「张三」。</li><li><b>看不懂的词</b>点顶部「名词解释」。</li>
<li><b>点击</b>组件或连线才高亮：相关连线画到最上层、标出传的是什么，并有图标沿线走；点空白处取消。右侧会列出它具体做什么、表的每一列干什么用。</li>
<li>双击组件放大；滚轮缩放、按住拖动；顶部「去看」跳到各区域；「▶ 走一遍」逐步讲 7 个场景（第一个是完整例子「一次提问全流程」），左右方向键翻页。讲解里 🔒 写这一步有几个事务、各包含什么，💥 写崩在这里谁兜底。</li></ul>`;
const hh=new URLSearchParams(location.hash.slice(1)); if(hh.get('noanim')) document.body.classList.add('still');
render(); st.vb=boxFit(WORLD.x,WORLD.y,WORLD.x+WORLD.w,WORLD.y+WORLD.h,1); setVB();
if(hh.get('go')){ ({api:()=>$('#gapi').click(),wk:()=>$('#gwk').click(),db:()=>$('#gdb').click(),top:()=>$('#gtop').click()})[hh.get('go')](); }
if(hh.get('tour')){ st.tour=hh.get('tour'); st.step=+(hh.get('step')||0); $('#tour').value=st.tour; tourGo(); }
if(hh.get('gl')) $('#bgl').click();
if(hh.get('sel')){ st.sel=hh.get('sel'); showNode(st.sel); applyHL(); }
})();

</script></body></html>
