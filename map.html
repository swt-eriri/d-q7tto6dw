<!DOCTYPE html>
<html lang="zh-CN"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OntoHelm 平台全景图</title>
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:var(--fg);background:var(--bg);height:100vh;display:flex;flex-direction:column}
header{background:#0f172a;color:#fff;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
header select,header input[type=text]{font:inherit;padding:4px 8px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#fff}
header button{font:inherit;padding:4px 10px;border-radius:6px;border:1px solid #475569;background:#1e293b;color:#fff;cursor:pointer}
header button:hover{background:#334155}
#search{position:relative}
#q{width:240px}
#results{display:none;position:absolute;top:34px;left:0;width:520px;max-height:420px;overflow:auto;background:#fff;color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:30}
.ri{padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}.ri:hover{background:#f1f5f9}
.rt{display:inline-block;font-size:11px;background:#e2e8f0;border-radius:4px;padding:0 5px;margin-right:4px}
nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;align-items:flex-end}
.tab{border:0;background:none;padding:9px 14px;font:inherit;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent}
.tab.on{color:var(--fg);border-bottom-color:#2563eb;font-weight:600}
#tools{margin-left:auto;display:flex;gap:10px;align-items:center;padding:4px 0;font-size:12px;color:var(--mut);flex-wrap:wrap}
#tools button{font:inherit;padding:2px 8px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer}
#kinds label{margin-right:6px;white-space:nowrap}
main{flex:1;display:flex;min-height:0}
.views{flex:1;position:relative;min-width:0}
.view{display:none;position:absolute;inset:0;overflow:auto;padding:10px}
.view.on{display:block}
#panel{width:380px;border-left:1px solid var(--line);background:#fff;overflow:auto;padding:14px 16px}
#panel h2{font-size:17px;margin:0 0 6px}#panel h3{font-size:13px;margin:14px 0 4px;color:#334155}
#panel ul{margin:0;padding-left:18px}#panel li{margin:2px 0}
.meta{margin-bottom:6px}
.chip,.badge{display:inline-block;color:#fff;border-radius:10px;padding:0 8px;font-size:12px;line-height:20px;vertical-align:middle}
.mut{color:var(--mut)}.pad{padding:6px 10px}
a{color:#2563eb;cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
code{font-family:Consolas,"SFMono-Regular",monospace;font-size:12.5px;background:#f1f5f9;border-radius:3px;padding:0 3px}
.ci{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0}
.kd{font-size:12px}
svg{display:block;user-select:none}
.grp rect{fill:#f1f5f9;stroke:#cbd5e1;stroke-dasharray:6 4}.grp text{fill:#94a3b8;font-size:13px}
.grp.hl rect{stroke:#2563eb}
.node{cursor:pointer}
.node>rect:first-child{fill:#fff;stroke:#cbd5e1;stroke-width:1.2;transition:all .15s}
.node.kind-external>rect:first-child,.node.kind-actor>rect:first-child{fill:#f8fafc;stroke-dasharray:4 3}
.node.kind-store>rect:first-child{fill:#f0fdfa}
.node:hover>rect:first-child,.node.hl>rect:first-child{stroke:var(--oc);stroke-width:2.2}
.node.sel>rect:first-child{stroke:var(--oc);stroke-width:3;fill:#eff6ff}
.nt{font-size:14px;font-weight:600;fill:#0f172a}.ns{font-size:11.5px;fill:#64748b}
.node.dim{opacity:.22}
.edge .ln{fill:none;stroke-width:1.6;opacity:.75}
.edge .hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.edge.hl .ln{stroke-width:3;opacity:1}
.edge.dim{opacity:.08}
.edge .lbl{display:none}.edge.hl .lbl{display:block}
.edge.ce .ln{opacity:.32}.edge.ce.hl .ln{opacity:1}
.edge .lbl rect{fill:#fff;stroke:#e2e8f0}.edge .lbl text{font-size:11px;text-anchor:middle;fill:#334155}
.edge.k-event .lbl text{fill:#b45309}.edge.k-callback .lbl text{fill:#b91c1c}
#legend{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;margin-bottom:6px;display:inline-block}
.lg{margin-right:10px;white-space:nowrap}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:3px;vertical-align:-2px}.lg i.dot{border-radius:50%}.lg svg{display:inline-block;vertical-align:middle;margin-right:3px}
#card{display:none;position:absolute;width:320px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 10px 28px rgba(15,23,42,.18);padding:10px 12px;z-index:20;font-size:13px}
#card ul{margin:6px 0 0;padding-left:18px}.cardh{display:flex;justify-content:space-between;gap:8px}.x{color:var(--mut);cursor:pointer;font-size:12px;white-space:nowrap}
details.tg{background:#fff;border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:4px 8px}
details.tg>summary{cursor:pointer;padding:6px 2px;font-size:15px}
details.tb{border-top:1px solid var(--line);padding:4px 6px}
details.tb>summary{cursor:pointer;padding:3px 0}
details.tb.flash{background:#fef9c3}
.tn{font-weight:600;font-size:13px}
.tbody{padding:4px 4px 8px 18px}
.tbody table,.ct{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
.tbody th,.tbody td,.ct th,.ct td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.tbody th,.ct th{background:#f8fafc}
.ct tr[data-contract]{cursor:pointer}.ct tr[data-contract]:hover{background:#f8fafc}
#tq{font:inherit;padding:5px 10px;border:1px solid var(--line);border-radius:6px;width:320px;margin-bottom:10px}
#mechs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card .ch{display:flex;gap:6px;align-items:center}.card .ref{margin-left:auto;font-size:12px}
.card p{margin:6px 0}.tch{margin:4px 0}.tg2{display:inline-block;font-size:12px;background:#f1f5f9;border-radius:4px;padding:0 6px;margin:2px 4px 2px 0}
.card details summary{cursor:pointer;color:var(--mut);font-size:12px}
.pg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.pg h3{margin:4px 0 6px;font-size:15px}.pi{padding:5px 4px;border-top:1px solid var(--line);cursor:pointer}.pi:hover{background:#f8fafc}
#tourbar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#0f172a;color:#fff;border-radius:12px;padding:10px 14px;gap:10px;align-items:center;max-width:min(980px,94vw);z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#tourbar button{font:inherit;padding:4px 12px;border-radius:6px;border:0;cursor:pointer}
#tourtxt{flex:1;font-size:15px}
body.present header .flt, body.present #panel, body.present #tools .kw{display:none}
body.present .nt{font-size:16px} body.present #tourtxt{font-size:18px}
</style></head><body>
<header>
  <h1>OntoHelm 平台全景图</h1>
  <div id="search"><input id="q" type="text" placeholder="搜索：模块、表、列、接口、机制"><div id="results"></div></div>
  <span class="flt"><select id="f-owner"></select>
  <select id="f-phase"><option value="">全部阶段</option><option>P0</option><option>P1</option><option>P2</option><option>P3</option></select>
  <select id="f-status"><option value="">全部状态</option><option>原设计</option><option>已改</option><option>待组长</option><option>讨论中</option></select></span>
  <select id="tour"></select>
  <button id="present">汇报模式</button>
  <span class="mut" style="color:#94a3b8;font-size:12px">数据截至 2026-11-13</span>
</header>
<nav>
  <button class="tab" data-view="overview">① 全景</button>
  <button class="tab" data-view="dep">② 模块依赖</button>
  <button class="tab" data-view="tables">③ 数据表</button>
  <button class="tab" data-view="contracts">④ 接口与事件</button>
  <button class="tab" data-view="mechs">⑤ 框架机制</button>
  <button class="tab" data-view="pending">⑥ 待定与修改</button>
  <div id="tools"><span class="kw" id="kinds"></span><label class="kw"><input type="checkbox" id="f-fold"> 显示判权、审计连线</label><span>缩放 <button id="zout">−</button><button id="zfit">适应</button><button id="zin">+</button></span></div>
</nav>
<main>
  <div class="views">
    <div class="view" id="v-overview"><div id="legend"></div><svg id="svg-ov"></svg></div>
    <div class="view" id="v-dep"><p class="mut" style="margin:0 0 4px">箭头：实线 = 调用方 → 提供方；虚线 = 发出方 → 订阅方。鼠标指向模块看它的连线和契约编号。依赖分 5 层（M07 最底层），只能上层调下层；反方向一律发通知。</p><svg id="svg-dep"></svg></div>
    <div class="view" id="v-tables"><input id="tq" placeholder="在表名、列名、说明里筛选"><div id="tables"></div></div>
    <div class="view" id="v-contracts"><div id="contracts"></div></div>
    <div class="view" id="v-mechs"><div id="mechs"></div></div>
    <div class="view" id="v-pending"><div id="pending"></div></div>
    <div id="card"></div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="tourbar"><button id="tprev">← 上一步</button><div id="tourtxt"></div><button id="tnext">下一步 →</button><button id="texit">退出</button></div>
<script>
const OWNERS = {
  "文韬": "#2563eb", "闻洛": "#16a34a", "蕴颐": "#9333ea", "嘉敏": "#ea580c", "础豪": "#0891b2", "外部": "#6b7280"
};
const STATUS = {
  "原设计": {c:"#64748b", d:"沿用原 RFC，未改动（表名待按改写规则加前缀、换 MySQL 写法）"},
  "已改": {c:"#0f766e", d:"文韬已改并写进新版 RFC"},
  "待组长": {c:"#b45309", d:"改动已报组长，等回复"},
  "讨论中": {c:"#7c3aed", d:"还在讨论，未定"}
};
const KINDS = {
  call: {name:"调用接口（同步）", color:"#334155", dash:""},
  event: {name:"发通知 / 订阅（异步）", color:"#d97706", dash:"7 5"},
  callback: {name:"DSH 回调", color:"#dc2626", dash:""},
  job: {name:"后台任务 / 宿主", color:"#0d9488", dash:"2 4"},
  http: {name:"HTTP 请求", color:"#64748b", dash:""},
  external: {name:"调用外部系统", color:"#9ca3af", dash:""}
};
const SCHEMA = {M01:"conversations",M02:"files",M03:"data_access",M04:"agents",M05:"resources",M06:"evolution",M07:"identity",M08:"operations",M09:"audit",T04:"platform"};

const NODES = [
  {id:"U", name:"用户 / 管理员", kind:"actor", owner:"外部", x:60, y:20, w:200, h:46, desc:"普通用户在对话页问数、看报告；管理员管理 Agent、资源、账号、模型和用量。", funcs:[]},
  {id:"APP", name:"外部接入应用", kind:"actor", owner:"外部", x:300, y:20, w:200, h:46, desc:"行内其他系统通过开放 API 代用户问数（接口细节在 RFC-0017，文韬负责）。", funcs:[]},
  {id:"EVR", name:"评估执行器（Python）", short:"评估执行器", kind:"process", owner:"闻洛", rfc:"0016", phase:"P3", status:"原设计", x:1020, y:20, w:240, h:46,
   desc:"M06 的执行部件，单独一个 Python 进程，不连数据库，只调 API 进程的内部接口 /internal/eval/v1。",
   funcs:["领取 M06 登记的评估任务（由 API 进程代它持有租约）","经 M06 的内部接口为每一格（用例 × 组 × 账号）开会话、发送、回答、读事件","把逐条结果交回 M06，汇总和展示都在 M06"]},
  {id:"T01", name:"T01 Web 工作台", short:"Web 工作台", kind:"framework", owner:"嘉敏", rfc:"0005", phase:"P0", status:"原设计", x:60, y:105, w:440, h:46,
   desc:"一个 React 单页应用，九个模块各占一个 feature。",
   funcs:["两套布局（使用侧、管理侧）、导航、路由、登录态","按服务端返回的能力清单显示菜单和按钮","从契约生成 API 客户端；统一的事件流钩子（断线续读）","公共组件与交互规范只实现一份（packages/ui）","生成内容隔离渲染（HTML 报告进沙箱 iframe）","mock 先行：前端不等后端"]},
  {id:"T02", name:"T02 API 入口（API 进程）", short:"API 入口", kind:"framework", owner:"文韬", rfc:"0004", phase:"P0", status:"已改", x:60, y:190, w:640, h:52,
   desc:"所有 HTTP 请求的入口：只认证（你是谁），不授权（能不能做由模块判断）。",
   funcs:["五类路径：页面 API、开放 API、工具回调、非工具回调、评估执行器内部接口","工具回调核验三步：验签防重放 → 向会话模块取执行凭据 → 交给模块","事件流：补读 + 每 0.5 秒轮询推送 + 接收 Worker 直推的逐字增量","开放 API 限流（进程内计数；细节在 0017）","统一错误映射；身份缓存 30 秒"]},
  {id:"T03", name:"T03 Worker（后台进程）", short:"Worker", kind:"framework", owner:"文韬", rfc:"0004", phase:"P0", status:"已改", x:800, y:190, w:460, h:52,
   desc:"跑后台任务的进程，和 API 进程装配同一套模块。",
   funcs:["领取并执行任务（自建任务表：租约、重试、按键串行、协作式取消）","定时调度：去重键保证只触发一次，不选主","每分钟重新提交未完成的事件登记行","DSH 跟随器、应答通道的宿主（长任务）","清理过期数据（分批删）"]},
  {id:"M03", name:"M03 数据访问", short:"数据访问", kind:"module", owner:"蕴颐", rfc:"0013", phase:"P1", status:"原设计", x:120, y:300, w:240, h:52, layer:4,
   desc:"取数只按可信身份和本次口径许可执行，数据权限由网关判定。",
   funcs:["问数 tool 回调 query：查口径许可 → 取可信身份 → 调取数网关 → 结果交 M02 登记 → 发用量回执","调用网关前先落记录，结果不确定先对账、不重发","错误分类：无权限停止、服务不可用暂停、计算量大缩小范围","探查轮次记录与配额","只读页面 API：按调用 ID 取 SQL 依据"]},
  {id:"M06", name:"M06 自进化与评估", short:"自进化与评估", kind:"module", owner:"闻洛", rfc:"0016", phase:"P3", status:"原设计", x:620, y:300, w:260, h:52, layer:4,
   desc:"自动分析按 turn 计数触发、固定批次；评估比较「只差一个因素」的两组，结果不自动采纳。",
   funcs:["自动分析规则：新增 turn、负反馈、执行失败、多次澄清，任一命中即触发","分析报告与优化建议（经 M01 发起自进化对话）","评估：对照组与实验组只差一处修改，三档评估账号分别汇总","用例导入与参考答案优先级","采纳建议时写 M04 的草稿，不自动发布"]},
  {id:"M01", name:"M01 会话", short:"会话", kind:"module", owner:"嘉敏", rfc:"0012", phase:"P1", status:"原设计", x:380, y:390, w:240, h:52, layer:3,
   desc:"一次发送 = 一个 turn + 一个执行；先落库再调 DSH，结果不确定只对账不重发。",
   funcs:["对话、turn、执行；每次执行受理时解析并记下实际 Agent 版本","待决定事项：口径确认、补问、审批","会话工作区：申请、续租、恢复、释放、异常回收","事件流：规范化 DSH 事件、编平台序号，供浏览器续读","反馈与纠错、标题、隐藏","跟随任务（盯 DSH 输出）的业务部分；对账任务（含「已受理」超过 30 秒）","执行凭据：工具回调时按 DSH 会话查"]},
  {id:"M04", name:"M04 Agent 配置与发布", short:"Agent 配置与发布", kind:"module", owner:"蕴颐", rfc:"0011", phase:"P1", status:"原设计", x:660, y:480, w:260, h:52, layer:2,
   desc:"Agent 版本 = 只读基础版本 + 页面配置；发布组装成不可变版本装进 DSH，与旧版本并存，指针切换成功才算发布。",
   funcs:["Agent 清单、基础版本登记、草稿（页面配置）","发布：组装不可变版本包 → 装进 DSH → 发布探测 → 切换指针","试运行版本与 hold（给评估用）","按 C19 维护各版本的在途引用，没有引用才卸载旧版本","系统默认与个人默认 Agent；开放范围"]},
  {id:"M02", name:"M02 文件与产出", short:"文件与产出", kind:"module", owner:"础豪", rfc:"0009", phase:"P1", status:"原设计", x:60, y:570, w:220, h:52, layer:1,
   desc:"原件和产出都是平台的永久文件，不依赖 DSH 工作区。",
   funcs:["上传原件（单文件 50 MB），只在平台存原件","产出与报告的文件版本及依据（SQL 依据经 M03 查）","下载只查访问权；生成数据导出要查导出权限","把原件放进 DSH 会话","HTML 产出隔离渲染"]},
  {id:"M05", name:"M05 资源库", short:"资源库", kind:"module", owner:"蕴颐", rfc:"0010", phase:"P1", status:"原设计", x:320, y:570, w:220, h:52, layer:1,
   desc:"资源都按「稳定 ID + 不可变版本 + 摘要」引用；MCP 连接是全局资源，变更即时生效。",
   funcs:["知识包及版本（知识经读取 tool 回调平台，按执行绑定的版本读）","Skill 库及不可变版本；tool 目录","MCP 连接与修订","MCP 代理：每个 Agent 版本一个专属地址，凭进程令牌认人","资源使用范围授权"]},
  {id:"M08", name:"M08 模型、用量与限额", short:"模型、用量与限额", kind:"module", owner:"闻洛", rfc:"0007", phase:"P1", status:"原设计", x:580, y:570, w:240, h:52, layer:1,
   desc:"发送前检查限额、占并发；用户池和后台池分开，池满一律拒绝不排队。",
   funcs:["可选模型与服务连接（DSH、模型网关、取数网关、知识服务）","并发名额：用户池、后台池，等待用户时释放","用量账本：按 DSH 回执的关联 ID 去重归集","运行状态、首页推荐问题、通用设置"]},
  {id:"M09", name:"M09 日志与审计", short:"日志与审计", kind:"module", owner:"础豪", rfc:"0008", phase:"P2", status:"原设计", x:860, y:570, w:220, h:52, layer:1,
   desc:"审计记录全部来自各模块按 C17 发出的事件，只追加不改不删；表在 P2 开工前补。",
   funcs:["操作日志、权限审计、应用调用记录","只消费 C17 审计事件，不调用其他业务模块","查看权限由 M07 控制"]},
  {id:"M07", name:"M07 身份与权限", short:"身份与权限", kind:"module", owner:"文韬", rfc:"0006", phase:"P1", status:"讨论中", x:380, y:670, w:240, h:52, layer:0,

告、管理员文件、数据导出结果都是一行，`id` 就是 `fileId`，也是接口里的 `outputId` 和 `reportId`：报告就是 `kind = REPORT` 的文件，它的版本即 `file_versions`。`FileMeta.latestVersionId` 和 `versions` 由 `file_versions` 算出，不存。"}, {"module": "M02", "name": "file_versions", "prefix": "fvr_", "desc": "文件版本：对象键、sha256、字节数", "write": "只追加", "retention": "随文件", "columns": [{"name": "id", "type": "text", "desc": "主键，即 `fileVersionId`"}, {"name": "file_id", "type": "text", "desc": "外键 → `files.id`"}, {"name": "version", "type": "int", "desc": "从 1 起，对应 `FileVersion.version`"}, {"name": "object_key", "type": "text", "desc": "bucket `files` 里的对象键"}, {"name": "sha256", "type": "text", "desc": "内容摘要，即接口里的 `digest`"}, {"name": "size_bytes", "type": "bigint", "desc": "字节数，即 `FileVersion.size`；`CHECK` 只要求不小于 0，上限按文件种类在接口层校验（见下）"}, {"name": "media_type", "type": "text", "desc": "媒体类型"}], "notes": ["约束：`(file_id, version)` 唯一；`object_key` 唯一。大小上限在接口层按文件种类校验：上传原件 50 MB（第 1 节），超过返回 `files.too-large`；产出、报告、导出的上限另定，当前不限制。运行角色不授 `UPDATE`、`DELETE`：报告每次修订新增一行，旧版本保留，可打开、可下载，不覆盖。", "说明：`addReportVersion` 在一个事务里锁文件行、`latest_version` 加一、插入新版本和它的依据；`reportId` 为 null 时先建 `REPORT` 文件（v1）。同一次调用重试由 tool 回调的幂等根键挡住，不会多出版本。`readContent` 按 `object_key` 生成短期有效的读取地址，不经过数据库存取内容。"], "rfc": "0009"}, {"module": "M02", "name": "output_provenance", "prefix": "prv_", "desc": "产出版本的依据", "write": "只追加", "retention": "随文件", "columns": [{"name": "id", "type": "text", "desc": "主键"}, {"name": "file_version_id", "type": "text", "desc": "外键 → `file_versions.id`，唯一"}, {"name": "execution_id", "type": "text", "desc": "产出它的执行，取自 `ctx.execution`（M01 的对象，只存 ID）"}, {"name": "caliber_version_id", "type": "text", "desc": "口径版本，可空（M01 的对象 `caliber_versions`，只存 ID）"}, {"name": "knowledge_versions", "type": "jsonb", "desc": "`VersionRef` 列表快照（稳定 ID、版本 ID、摘要）"}, {"name": "model_id", "type": "text", "desc": "可空"}, {"name": "data_call_ids", "type": "text[]", "desc": "M03 的取数调用 ID；SQL 依据从这里查"}, {"name": "coverage", "type": "text", "desc": "`FULL` / `PARTIAL` / `UNKNOWN`；未知记 `UNKNO ": "gateway_message", "type": "text", "desc": "网关返回的说明；可为 null"}, {"name": "started_at", "type": "timestamptz", "desc": "写记录的时间（`SqlRecordView.startedAt`），数据库时钟"}, {"name": "reconcile_checked_at", "type": "timestamptz", "desc": "最近一次对账的时间；从未对账为 null"}, {"name": "revision", "type": "bigint", "desc": "每次改结论时加一。结论的写入（网关返回后的结算、对账得出结论）靠条件 `outcome = 'UNKNOWN'`，先到的生效，后到的更新不到行；不带 `revision` 条件"}], "notes": ["约束：`callback_key` 唯一；`outcome`、`mode`、`coverage`、`principal_kind` 各有 `CHECK`；`outcome = 'OK'` 之外的行 `output_id` 为 null。结论只会从 `UNKNOWN` 变成别的值，不会反向。", "不存结果明细，查询返回的行一行都不存；`DataQueryResult.summary` 不入库，只随幂等记录保留 24 小时。`DataQueryResult` 的其余字段都能在本表找到来源。", "对账：对账任务是框架任务（`platform.jobs`，租约和代次由框架提供，RFC-0004 第 3.4 节），它选 `outcome = 'UNKNOWN'`、`reconcile_checked_at` 为 null 且 `started_at` 早于等待阈值（数据库时钟）的行；等待阈值大于网关调用超时（C14 取到的超时），免得对账碰上还在途中的正常调用。网关能按请求 ID 查询时，用原请求 ID 查到结论就用条件 `outcome = 'UNKNOWN'` 改 `outcome` 等列（此时若调用方的结算已先写入，这次更新不到行，不算错）；查不到结论或网关不支持查询（RFC-0001 Q06）就是对账放弃：保持 `UNKNOWN`，只更新 `reconcile_checked_at`（不带条件，`revision` 不加一），并发一条用量回执，计量字段为 null，`correlationId` 用 `dataCallId`（M08 据此去重）。网关查询本身出错的，不算放弃，下次再选。对账不重发，也不补登产出；对账得出结论时也不补发用量回执。正常结算照常按第 2.3 节发回执。", "索引：`(execution_id, started_at)`（按执行查）；`(started_at) WHERE outcome = 'UNKNOWN' AND reconcile_checked_at IS NULL`（对账任务选行）。按 `dataCallId` 查询走主键。", "访问：这张表不是只追加表（`outcome` 要补结论），运行角色有增改查和 `DELETE`；过期数据按 RFC-0001 Q14 定的保留期由本模块的定时任务用运行角色清理。"], "rfc": "0013"}, {"module": "M03", "name": "execution_probe_counters", "prefix": "dpc_", "desc": "每个执行已用的探查轮次", "write": "可更新", "retention": "按 RFC-0001 Q14", "columns": [{"name": "id", "type": "text", "desc": "主键"}, {"name": "execution_id", "type": "text", "desc": "M01 的执行 ID，唯一"}, {"name": "rounds_used", "type": "int", "desc": "本执行已用的轮次，0 到 5"}], "notes": ["约束：`execution_id` 唯一；`CHECK (rounds_used BETWEEN 0 AND 5)`。", "并发：占一轮是一条原子更新 `rounds_used = rounds_used + 1 WHERE execution_id = ? AND rounds_used < 5`（行不存在时先插入再更新），返回的值写进这次 `data_calls.probe_round`；更新不到行即已满 5 轮，这次调用记 `PROBE_LIMIT_REACHED`、`probe_round` 取 5，不调网关。哪些调用占轮次由 Q07 定，本表只管计数不越界。", "索引：`execution_id` 的唯一索引。"], "rfc": "0013"}, {"module": "M04", "name": "agents", "prefix": "agt_", "desc": "Agent 清单、当前发布版本指针、版本号计数", "write": "可更新", "retention": "长期；Agent 不删除", "columns": [{"name": "id", "type": "text", "desc": "主键，`agt_` 前缀 ULID；`ResolvedAgentVersion.agent.id` 的 `agentId`"}, {"name": "source", "type": "text", "desc": "`CODE_PACKAGE` / `DSH_PRESET` / `CUSTOM`"}, {"name": "code_package_id", "type": "text", "desc": "仓库 `agents/<id>/` 的目录名；仅 `CODE_PACKAGE` 有，其余为空"}, {"name": "published_version_id", "type": "text", "desc": "当前发布版本（`agent_versions.id`）；从未发布时为空。**比较并替换比这一列**"}, {"name": "published_since", "type": "timestamptz", "desc": "指针切换到该版本的时间，即 `currentSince`"}, {"name": "last_version_no、last_trial_no", "type": "int", "desc": "版本号和试运行编号的计数，用于组成 `v<版本号>`、`t<编号>`；在 `agents` 行锁下用 `UPDATE … RETURNING` 取下一个"}, {"name": "last_draft_revision", "type": "bigint", "desc": "已用过的最大草稿修订号；新草稿的修订号从它加一开始，同一 Agent 内单调递增、不重复"}, {"name": "created_by", "type": "text", "desc": "创建人（M07 用户 ID）"}], "notes": ["约束：`source` 加 `CHECK`；`code_package_id` 部分唯一（非空时）；`published_version_id` 外键到 `agent_versions`。", "并发：切换指针只用 `UPDATE agents SET published_version_id = :新版本, published_since = now() WHERE id = :agentId AND published_version_id IS NOT DISTINCT FROM :发布开始时读到的版本`，影响行数为 0 即冲突。同一事务里改发布记录并登记 C04 事件（第 2 节第 5 步）。", "索引：`code_package_id` 唯一；`published_version_id`（评估和清理按它判断「是否当前发布版本」）。"], "rfc": "0011"}, {"module": "M04", "name": "agent_base_versions", "prefix": "abv_", "desc": "基础版本登记", "write": "只追加", "retention": "长期", "columns": [{"name": "id", "type": "text", "desc": "主键，`abv_` 前缀"}, {"name": "agent_id", "type": "text", "desc": "外键到 `agents`"}, {"name": "version_label", "type": "text", "desc": "CI 给的基础版本号"}, {"name": "digest", "type": "text", "desc": "基础版本摘要；自进化修改的 `baseDigest` 以它为起点比对"}, {"name": "dsh_preset_name", "type": "text", "desc": "DSH 预设来源时的预设名（标准、PTC、极简、创造）"}, {"name": "object_key、sha256、size_bytes", "type": "t aft_revision`）不会和旧草稿混淆。", "「有未发布修改」是计算出来的：草稿 `revision` 大于当前发布版本的 `draft_revision`，或当前发布版本不是由这份草稿发布的。"], "rfc": "0011"}, {"module": "M04", "name": "draft_file_changes", "prefix": "dfc_", "desc": "草稿里已采纳的自进化文件修改", "write": "可更新", "retention": "随草稿；撤回即删除该行", "columns": [{"name": "id", "type": "text", "desc": "主键，`dfc_` 前缀"}, {"name": "draft_id", "type": "text", "desc": "外键到 `agent_drafts`"}, {"name": "target_file", "type": "text", "desc": "Agent 包内的相对路径"}, {"name": "location", "type": "text", "desc": "文件内位置；整文件覆盖时为空"}, {"name": "before_text、after_text", "type": "text", "desc": "改前、改后"}, {"name": "base_digest", "type": "text", "desc": "改前目标文件的摘要，用于冲突检测"}, {"name": "suggestion_id、suggestion_revision", "type": "text、int", "desc": "来源建议（M06 的 ID，不建外键）"}], "notes": ["约束：（`draft_id`、`suggestion_id`、`suggestion_revision`）唯一，重复采纳同一条幂等；`revertFileChange` 按这三列找到行并删除，找不到抛 `agents.change-not-in-draft`。", "同一文件有多条修改时按 `id`（ULID 有序）先后叠加；`applyFileChange` 的 `baseDigest` 与当前叠加结果的摘要不一致，抛 `agents.base-digest-mismatch`。", "发布时按修订号快照这份清单，「实际包含的建议」（`includedSuggestions`）存在发布记录里，不靠事后查本表。"], "rfc": "0011"}, {"module": "M04", "name": "agent_versions", "prefix": "agv_", "desc": "不可变 Agent 版本（含试运行版本）", "write": "可更新（仅 `uninstalled_at` 列授 `UPDATE`）", "retention": "长期", "columns": [{"name": "id", "type": "text", "desc": "主键，`agv_` 前缀；即 `agentVersionId`、试运行版本 ID"}, {"name": "agent_id", "type": "text", "desc": "外键到 `agents`"}, {"name": "kind", "type": "text", "desc": "`PUBLISHED` / `TRIAL`（`AgentVersionKind`）"}, {"name": "version_no", "type": "int", "desc": "`PUBLISHED` 时是 `v<版本号>` 的版本号，`TRIAL` 时是 `t<编号>` 的编号，取自 `agents` 的计数"}, {"name": "base_version_id", "type": "text", "desc": "所用基础版本，外键到 `agent_base_versions`"}, {"name": "draft_revision", "type": "bigint", "desc": "组装所用的草稿修订号；`BasePlusChange` 试运行版本为空"}, {"name": "name、purpose", "type": "text", "desc": "名称与用途快照"}, {"name": "package_digest", "type": "text", "desc": "**完整包摘要**，即 `VersionRef.digest`"}, {"name": "tools_digest", "type": "text", "desc": "版本包登记的 tool 清单摘要，探测摘要与它比对"}, {"name": "preset_id", "type": "text", "desc": "DSH preset ID（`oh.<agentId>.v<版本号>` 或 `oh.<agentId>.t<编号>`），组装时按命名规则算出"}, {"name": "object_key、sha256、size_bytes", "type": "text、text、bigint", "desc": "bucket `agents` 里组装好的版本包"}, {"name": "visibility_mode", "type": "text", "desc": "`ALL_USERS` / `SPECIFIED_USERS`；指定用户见 `agent_version_users`；试运行版本固定 `SPECIFIED_USERS` 且无用户"}, {"name": "spec", "type": "jsonb", "desc": "解析结果快照：`businessTools`、`mcpBindings`、`skills`，只随 `ResolvedAgentVersion` 返回，不参与查询"}, {"name": "uninstalled_at", "type": "timestamptz", "desc": "**「已卸载」标记**：卸载任务确认 DSH 已卸载后写入；其余内容不变"}], "notes": ["约束：（`agent_id`、`kind`、`version_no`）唯一；`preset_id` 唯一。", "「已发布」不是本表的列：版本是否发布过看 `publish_records` 里有无状态为 `PUBLISHED` 的记录。`getVersion` 对非 `EVALUATION` 会话只取这类版本；「已安装未上线」「安装失败」的版本不可被选。", "版本离开当前发布版本的时间是计算出来的：取 `publish_records` 里 `previous_version_id` 等于它、且 `status = 'PUBLISHED'` 的那条记录的 `published_at`（卸载的宽限期从这里算起）。", "索引：（`agent_id`、`kind`、`version_no`）唯一索引；（`uninstalled_at` 为空）的部分索引，服务清理任务扫描「还装着」的版本。"], "rfc": "0011"}, {"module": "M04", "name": "agent_version_users", "prefix": "avu_", "desc": "版本的开放范围里指定的用户", "write": "只追加", "retention": "随版本", "columns": [], "notes": [], "rfc": "0011", "intro": "（`agent_version_id`、`user_id`）唯一，一行一个被指定的用户。`resolveForExecution` 与 `listSelectableAgents` 判断开放范围时，`visibility_mode = ALL_USERS` 直接通过，否则查这张表；`user_id` 是 M07 用户 ID，不建外键。"}, {"module": "M04", "name": "trial_versions", "prefix": "trv_", "desc": "试运行版本的状态与来源", "write": "可更新", "retention": "按 RFC-0001 Q14", "columns": [{"name": "id", "type": "text", "desc": "主键，`trv_` 前缀"}, {"name": "agent_version_id", "type": "text", "desc": "外键到 `agent_versions`，唯一；对外的 `trialVersionId` 就是它"}, {"name": "evaluation_id", "type": "text", "desc": "发起评估（M06，不建外键）"}, {"name": "source_kind", "type": "text", "desc": "`base-plus-change` / `draft`（`TrialSource` 的 `kind`）"}, {"name": "parent_version_id", "type": "text", "desc": "`BasePlusChange` 的基准 Agent 版本 ID，外键到 `agent_versions`；`draft` 时为空"}, {"name": "change", "type": "jsonb", "desc": "`BasePlusChange` 的 `FileChange` 与 `SuggestionRef` 快照"}, {"name": "status", "type": "text", "desc": "`INSTALLING` / `READY` / `FAILED` / `RETIRED`（`TrialStatus`）"}, {"name": "failure", "type": "text", "desc": "`FAILED` 时的原因（`TrialVersionView.failure`）"}, {"name": "retired_at", "type": "timestamptz", "desc": "**「已退役」**：`retireTrialVersion` 写入；重复调用不改"}], "notes": ["约束：`status` 加 `CHECK`；`retired_at` 非空当且仅当 `status = 'RETIRED'`。试运行版本只在 `status = 'RETIRED'` 时才满足卸载条件第 4 条（第 3 节）。", "试运行版本经 `getVersion` 取，只有 `forSessionKind = EVALUATION` 且 `status = 'READY'` 时返回 `version`。"], "rfc": "0011", "intro": "试运行版本在 `agent_versions` 之外的状态与来源（第 4 节、C03）。"}, {"module": "M04", "name": "publish_records", "prefix": "apr_", "desc": "发布记录", "write": "可更新", "retention": "长期", "columns": [{"name": "id", "type": "text", "desc": "主键，`apr_` 前缀"}, {"name": "agent_id", "type": "text", "desc": "外键到 `agents`"}, {"name": "agent_version_id", "type": "text", "desc": "本次生成的版本，外键到 `agent_versions`"}, {"name": "draft_id", "type": "text", "desc": "外键到 `agent_drafts`"}, {"name": "draft_revision", "type": "bigint", "desc": "发布请求带的草稿修订号"}, {"name": "package_digest", "type": "text", "desc": "完整包摘要（与版本一致，记录发布时看到的内容）"}, {"name": "previous_version_id", "type": "text", "desc": "发布开始时读到的当前发布版本，即比较并替换的期望值；首次发布为空"}, {"name": "status", "type": "text", "desc": "`ASSEMBLED`（组装完成）/ `INSTALLED`（已安装未上线）/ `PUBLISHED`（已发布）/ `INSTALL_FAILED`（安装失败）"}, {"name": "failure", "type": "text", "desc": "`INSTALL_FAILED` 时的原因（含探测失败）"}, {"name": "included_suggestions", "type": "jsonb", "desc": "`SuggestionRef` 列表，即 `includedSuggestions`，只含最终版本里实际包含的修改"}, {"name": "published_by", "type": "text", "desc": "发起发布的管理员"}, {"name": "published_at", "type": "timestamptz", "desc": "切换成功的时间；仅 `PUBLISHED` 有"}], "notes": ["约束：（`draft_id`、`draft_revision`）在 `status = 'PUBLISHED'` 时唯一（部分唯一索引）：**同一草稿修订号只发布一次**；安装失败可以重试，重试生成新版本号和新记录。（`agent_version_id`）唯一。", "并发与一致：发布任务按串行键 `agent-publish:<agentId>` 执行（RFC-0004 第 3.4 节），同一 Agent 同时只有一条记录在推进。状态改为 `PUBLISHED`、`agents.published_version_id` 比较并替换和 C04 事件登记在同一事务里；比较并替换没有命中则记录保持 `INSTALLED`，不发事件。", "索引：（`agent_id`、`created_at` 降序）服务发布记录列表；（`previous_version_id`）服务离开当前发布版本时间的查询。"], "rfc": "0011"}, {"module": "M04", "name": "agent_defaults", "prefix": "adf_", "desc": "系统默认与个人默认 Agent", "write": "可更新", "retention": "长期", "columns": [{"name": "id", "type": "text", "desc": "主键，`adf_` 前缀"}, {"name": "scope", "type": "text", "desc": "`SYSTEM` / `USER`"}, {"name": "user_id", "type": "text", "desc": "`USER` 时的用户 ID（M07，不建外键）；`SYSTEM` 为空"}, {"name": "agent_id", "type": "text", "desc": "外键到 `agents`"}, {"name": "set_by", "type": "text", "desc": "设置人"}], "notes": ["约束：`scope` 加 `CHECK`，`scope = 'SYSTEM'` 当且仅当 `user_id` 为空；系统默认只有一行（`scope = 'SYSTEM'` 的部分唯一索引），每个用户一行（`user_id` 部分唯一索引）；校验：系统默认的 Agent 必须是「已发布且对所有使用者开放」的 Agent，发布时校验（第 2 节第 2 步）；个人默认保存时校验该 Agent 对该用户开放。发布会让当前系统默认 Agent 不再对所有使用者开放时，发布校验返回 `agents.default-visibility-conflict`，不写本表（Q23）。", "个人默认对用户不再开放时，`resolveForExecution` 跳过它，落到系统默认；没有系统默认时抛 `agents.no-default`。"], "rfc": "0011"}, {"module": "M04", "name": "version_execution_refs", "prefix": "vxr_", "desc": "每个版本的在途执行引用（来自 C19）", "write": "可更新", "retention": "已释放的按 RFC-0001 Q14", "columns": [{"name": "id", "type": "text", "desc": "主键，`vxr_` 前缀"}, {"name": "agent_version_id", "type": "text", "desc": "外键到 `agent_versions`；取自 `version-ref-acquired` 载荷"}, {"name": "execution_id", "type": "text", "desc": "M01 的执行 ID，不建外键"}, {"name": "acquired_at", "type": "timestamptz", "desc": "收到 `acquired` 的时间"}, {"name": "released_at", "type": "timestamptz", "desc": "收到 `released` 的时间；为空表示在途"}], "notes": ["约束：（`execution_id`）唯一。`acquired` 用「插入，冲突忽略」；`released` 用「`WHERE execution_id = :id AND released_at IS NULL` 更新」。有序订阅保证同一执行的 `released` 不先于 `acquired` 处理，重复投递在这两条语句上幂等。", "索引：（`agent_version_id`）部分索引（`released_at` 为空），卸载任务按它判断是否还有在途执行。", "清理：已释放且超过保留期的行由本模块定时任务整批删除，在途的行不删。"], "rfc": "0011", "intro": "本模块有序订阅 C19，每个执行一行，按执 不存凭据，也不存探测到的 tool 定义。", "索引：（`dsh_session_id`）唯一索引，服务 `resolveProbe`。"], "rfc": "0011"}, {"module": "M04", "name": "skill_version_notices", "prefix": "snv_", "desc": "已见到的 skill 新版本（来自 C16）", "write": "只追加", "retention": "按 RFC-0001 Q14", "columns": [{"name": "id", "type": "text", "desc": "主键，`snv_` 前缀"}, {"name": "skill_id", "type": "text", "desc": "skill 的稳定 ID（M05，不建外键）"}, {"name": "skill_version_id", "type": "text", "desc": "新版本 ID"}, {"name": "digest", "type": "text", "desc": "新版本摘要"}], "notes": ["约束：（`skill_id`、`skill_version_id`）唯一，事件重复投递幂等。", "草稿里某个 skill 的版本不是该 `skill_id` 已登记的最新版本时，页面提示有新版本；只提示，不自动换。"], "rfc": "0011"}, {"module": "M05", "name": "knowledge_packs", "prefix": "kpk_", "desc": "知识包：启停状态、当前版本、`currentSince`", "write": "可更新（乐观锁）", "retention": "长期；移除是软删除", "columns": [{"name": "id", "type": "text", "desc": "主键，即 `knowledgePackId`"}, {"name": "name", "type": "text", "desc": "知识包名称（`ResolvedKnowledge.packName`）"}, {"name": "status", "type": "text", "desc": "`ACTIVE` / `DISABLED`（`ResourceStatus`）"}, {"name": "current_version_id", "type": "text", "desc": "当前版本，指向本 schema 的 `knowledge_versions`（可延迟外键，同一事务里先建版本再设当前版本）；只能指向正式版本"}, {"name": "current_since", "type": "timestamptz", "desc": "该版本成为当前版本的时间；切换当前版本（含回滚、重新启用旧版本）时与 `current_version_id` 在同一次更新里改"}, {"name": "revision", "type": "bigint", "desc": "乐观锁；启停、切换当前版本、移除都带「revision 等于读到的值」的条件"}, {"name": "deleted_at", "type": "timestamptz", "desc": "移除本地知识接入（OH-KB-F011）的软删除；已移除的包 `resolveKnowledge` 按 `resources.not-found` 处理，版本和文件不动"}], "notes": ["约束：`CHECK (status IN ('ACTIVE','DISABLED'))`。", "索引：`(deleted_at, name)`（知识包列表）。"], "rfc": "0010"}, {"module": "M05", "name": "knowledge_versions", "prefix": "kvr_", "desc": "知识版本，含评估用的派生版本", "write": "可更新", "retention": "正式版本长期、不删；派生版本评估后删除", "columns": [{"name": "id", "type": "text", "desc": "主键，即 `VersionRef.versionId`"}, {"name": "knowledge_pack_id", "type": "text", "desc": "所属知识包，外键，即 `VersionRef.id`"}, {"name": "name", "type": "text", "desc": "版本名称（`KnowledgeVersion.name`）"}, {"name": "digest", "type": "text", "desc": "版本摘要（`VersionRef.digest`），由文件清单的摘要算出"}, {"name": "derived_for_evaluation", "type": "text", "desc": "派生版本只对这次评估可见，存 M06 的评估 ID；正式版本为 null"}, {"name": "base_version_id", "type": "text", "desc": "派生版本的基准版本，外键指向本表；正式版本为 null"}, {"name": "deleted_at", "type": "timestamptz", "desc": "派生版本被删除的时间；正式版本恒为 null"}], "notes": ["约束：`CHECK (deleted_at IS NULL OR derived_for_evaluation IS NOT NULL)`，正式版本不能删；`CHECK ((derived_for_evaluation IS NULL) = (base_version_id IS NULL))`。", "`KnowledgeVersion.status` 不单独存，取所属知识包的 `status`。派生版本不进 `current_version_id`，也不出现在知识包的版本列表里。", "索引：`(knowledge_pack_id, created_at) WHERE derived_for_evaluation IS NULL`（知识包详情的版本列表）；`(derived_for_evaluation) WHERE derived_for_evaluation IS NOT NULL`（按评估找派生版本）。", "删除派生版本：同一事务里删它的 `knowledge_files` 行并置 `deleted_at`，再删 `derived/<knowledge_version_id>/` 下的对象；已删除的再调返回同样的 `deleted`（`DeleteResult`），行本身留作标记。版本行是 `DeleteResult` 幂等的依据，随清理任务按 RFC-0001 Q14 处理。传入正式版本 ID 一律拒绝，不删。"], "rfc": "0010"}, {"module": "M05", "name": "knowledge_files", "prefix": "kfl_", "desc": "知识版本的文件清单（引用和摘要）", "write": "插入与过期删除", "retention": "随所属版本；只有派生版本的文件会删", "columns": [{"name": "id", "type": "text", "desc": "主键"}, {"name": "knowledge_version_id", "type": "text", "desc": "所属版本，外键"}, {"name": "path", "type": "text", "desc": "文件在知识包里的路径（`KnowledgeEntry.path`）"}, {"name": "size_bytes", "type": "bigint", "desc": "`KnowledgeEntry.size`"}, {"name": "sha256", "type": "text", "desc": "`KnowledgeEntry.digest`"}, {"name": "object_key", "type": "text", "desc": "bucket `resources` 里的对象键"}], "notes": ["约束：`(knowledge_version_id, path)` 唯一。正式版本的行写入后不改不删；派生版本建立时复制基准版本的全部行，只有 `targetFile` 那一行换成新的 `sha256` 和 `object_key`（`baseDigest` 与基准版本里该文件的 `sha256` 不一致就返回 `resources.base-digest-mismatch`）。", "索引：唯一约束 `(knowledge_version_id, path)` 服务 `list_knowledge`、`read_knowledge`（第 3.3 节，版本取自 `ctx.execution.knowledgeVersions`）。"], "rfc": "0010"}, {"module": "M05", "name": "skills", "prefix": "skl_", "desc": "Skill：名称、启停状态", "write": "可更新（乐观锁）", "retention": "长期", "columns": [], "notes": [], "rfc": "0010", "intro": "`id`；`name`；`status`（`ACTIVE` / `DISABLED`）；`revision`（乐观锁，启停带「revision 等于读到的值」的条件）。"}, {"module": "M05", "name": "skill_versions", "prefix": "skv_", "desc": "Skill 的不可变版本", "write": "只追加", "retention": "长期", "columns": [], "notes": [], "rfc": "0010", "intro": "`id`（`VersionRef.versionId`）；`skill_id`（外键，即 `VersionRef.id`）；`name`；`digest`（`SkillPackage.digest`，文件清单摘要）。`SkillVersion.status` 不单独存，取所属 Skill 的 `status`。"}, {"module": "M05", "name": "skill_files", "prefix": "sfl_", "desc": "Skill 版本的文件清单（引用和摘要）", "write": "只追加", "retention": "随所属版本，长期", "columns": [], "notes": [], "rfc": "0010", "intro": "`id`；`skill_version_id`（外键）；`path`；`sha256`（`SkillFile.digest`）；`size_bytes`；`object_key`。`SkillFile.contentRef` 由 `object_key` 现签，不入库。"}, {"module": "M05", "name": "tool_catalog", "prefix": "tol_", "desc": "业务 tool、内置 tool 的目录", "write": "可更新（乐观锁）", "retention": "长期", "columns": [], "notes": [], "rfc": "0010"}, {"module": "M05", "name": "mcp_connections", "prefix": "mcn_", "desc": "MCP 连接：状态、当前修订、加密凭据", "write": "可更新（乐观锁）", "retention": "长期", "columns": [{"name": "id", "type": "text", "desc": "主键，即 `connectionId`"}, {"name": "name", "type": "text", "desc": "连接名称，唯一"}, {"name": "status", "type": "text", "desc": "`ENABLED` / `DISABLED`（`ConnectionStatus`）"}, {"name": "current_revision_id", "type": "text", "desc": "当前修订，指向本 schema 的 `mcp_connection_revisions`（可延迟外键）"}, {"name": "credential_enc", "type": "bytea", "desc": "代理访问 MCP 服务用的凭据，内核 `secrets.encrypt` 加密，带密钥版本；明文不入库，接口和日志都不回显；无需凭据的连接为 null"}, {"name": "identity_forwarding", "type": "text", "desc": "要不要把用户身份传给 MCP 服务：`NONE` / `USER_ID` / `EMPLOYEE_NO`（不传、本系统用户 ID、工号）；不是 `NONE` 的连接，代理不放给 `evolution` 令牌。「外部身份」不支持，见 RFC-0001 Q24"}, {"name": "allow_eval_accounts", "type": "boolean", "desc": "评估账号（`eval-account`）令牌能不能用这条连接；mem0 连接为 false，代理按它拒绝（第 2 节）"}, {"name": "revision", "type": "bigint", "desc": "乐观锁；启停、换凭据、切换当前修订都带「revision 等于读到的值」的条件"}], "notes": ["约束：`status`、`identity_forwarding` 各有 `CHECK`（`identity_forwarding IN ('NONE','USER_ID','EMPLOYEE_NO')`）；`name` 唯一。", "启停和换凭据只更新本表，`current_revision_id` 不变。新修订与 `current_revision_id` 的切换在同一事务里，带 `revision` 条件，并发的变更只有一个成功。"], "rfc": "0010"}, {"module": "M05", "name": "mcp_connection_revisions", "prefix": "mrv_", "desc": "MCP 连接修订", "write": "只追加", "retention": "长期", "columns": [{"name": "id", "type": "text", "desc": "主键，即 `VersionRef.versionId`（修订 ID）"}, {"name": "connection_id", "type": "text", "desc": "所属连接，外键，即 `VersionRef.id`"}, {"name": "seq", "type": "int", "desc": "该连接内的修订序号，从 1 递增"}, {"name": "endpoint_url", "type": "text", "desc": "MCP 服务地址；不含凭据"}, {"name": "tools_digest", "type": "text", "desc": "tool 定义摘要（`VersionRef.digest`）"}], "notes": ["约束：`(connection_id, seq)` 唯一。运行角色不授 `UPDATE`、`DELETE`。"], "rfc": "0010", "intro": "（只追加）"}, {"module": "M05", "name": "mcp_revision_tools", "prefix": "mrt_", "desc": "修订里的 tool 定义", "write": "只追加", "retention": "随所属修订，长期", "columns": [{"name": "id", "type": "text", "desc": "主键"}, {"name": "revision_id", "type": "text", "desc": "所属修订，外键"}, {"name": "name", "type": "text", "desc": "tool 名（`ToolSignature.name`）"}, {"name": "definition_digest", "type": "text", "desc": "`ToolSignature.definitionDigest`"}, {"name": "definition", "type": "jsonb", "desc": "tool 的参数和说明，供代理向 DSH 暴露；不参与查询条件"}], "notes": ["约束：`(revision_id, name)` 唯一。登记 tool（第 4.5 节）时按这张表核对当前修订里有没有这个 tool。"], "rfc": "0010", "intro": "（只追加）"}, {"module": "M05", "name": "mcp_proxy_bindings", "prefix": "mpb_", "desc": "Agent 版本在 MCP 代理上的登记", "write": "可更新", "retention": "按 RFC-0001 Q14", "columns": [{"name": "id", "type": "text", "desc": "主键；版本专属地址 `ProxyBinding.proxyPath` 由它算出，不另存"}, {"name": "agent_version_id", "type": "text", "desc": "M04 的 Agent 版本 ID，只存 ID，唯一"}, {"name": "unbound_at", "type": "timestamptz", "desc": "解绑时间；未解绑为 null"}], "notes": ["登记：`bindVersion` 在一个事务里写本行和 `mcp_proxy_binding_tools`；连接停用返回 `resources.disabled`，tool 不在连接当前修订里返回 `resources.mcp-tool-not-found`。同一请求重发按 `idempotency` 返回同一地址。", "解绑：`unbindVersion` 把 `unbound_at` 置为当前时间；已解绑或没有登记的再调返回同样的 `unbound`，不报错，行不删。代理收到已解绑地址的请求一律拒绝。", "索引：`agent_version_id` 唯一索引（按版本查登记）。"], "rfc": "0010"}, {"module": "M05", "name": "mcp_proxy_binding_tools", "prefix": "mpt_", "desc": "登记里勾选的 tool", "write": "只追加", "retention": "随所属登记", "columns": [{"name": "id", "type": "text", "desc": "主键"}, {"name": "binding_id", "type": "text", "desc": "所属登记，外键"}, {"name": "connection_id", "type": "text", "desc": "勾选的连接，外键"}, {"name": "tool_name", "type": "text", "desc": "勾选的 tool 名"}], "notes": ["约束：`(binding_id, connection_id, tool_name)` 唯一。代理只放出这里登记的 tool。"], "rfc": "0010", "intro": "（只追加）"}, {"module": "M05", "name": "mcp_call_records", "prefix": "mpc_", "desc": "MCP 代理的调用记录", "write": "可更新", "retention": "按 RFC-0001 Q14", "columns": [], "notes": [], "rfc": "0010"}, {"module": "M05", "name": "resource_grants", "prefix": "rgr_", "desc": "知识包、MCP 连接的使用范围（对象授权）", "write": "可更新", "retention": "长期；撤销授权即删行", "columns": [{"name": "id", "type": "text", "desc": "主键"}, {"name": "resource_type", "type": "text", "desc": "`KNOWLEDGE_PACK` / `MCP_CONNECTION`"}, {"name": "resource_id", "type": "text", "desc": "知识包 ID 或连接 ID；按 `resource_type` 指向本 schema 的 `knowledge_packs` 或 `mcp_connections`（两种目标，不建外键，写入时核对存在）"}, {"name": "grantee_kind", "type": "text", "desc": "`ALL_USERS` / `USER`"}, {"name": "grantee_id", "type": "text", "desc": "`USER` 时为用户 ID（M07 的对象，只存 ID）；`ALL_USERS` 时为 null"}], "notes": ["约束：`resource_type`、`grantee_kind` 各有 `CHECK`；`CHECK ((grantee_kind = 'USER') = (grantee_id IS NOT NULL))`；`(resource_type, resource_id, grantee_kind, grantee_id)` 唯一（`grantee_id` 为 null 的行用 `NULLS NOT DISTINCT`）。", "判权：`resolveKnowledge` 对每个知识包，看有没有 `ALL_USERS` 行，或 `USER` 行的 `grantee_id` 等于 `ctx.principal` 的用户 ID，没有就返回 `resources.not-permitted`。MCP 代理对令牌认出的用户主体同样按连接判；连接下的 tool 随连接，不单独授权，登记的 tool 清单（第 4.5 节）再限定能放出哪些。评估账号能用哪些资源按第 2 节的规则（只限 mem0 连接不放评估账号，由 `allow_eval_accounts` 表达），本表不为评估账号另设授权。", "撤销授权直接删行，不软删除；授权变化只影响之后的判权，已受理执行记下的知识版本不变（第 3.1 节）。", "索引：`(resource_type, resource_id)`（按资源列授权）；`(grantee_id, resource_type) WHERE grantee_kind = 'USER'`（按用户找可用资源）。"], "rfc": "0010"}, {"module": "M07", "name": "users", "prefix": "usr_", "desc": "本系统账号：工号、姓名、角色、状态、导出权限", "write": "可更新（乐观锁）", "retention": "长期；停用不删，移除为软删除", "columns": [{"name": "id", "type": "text", "desc": "主键，即 `userId`"}, {"name": "employee_no", "type": "text", "desc": "工号"}, {"name": "name", "type": "text", "desc": "姓名（显示名）"}, {"name": "role", "type": "text", "desc": "`USER` / `SITE_ADMIN`"}, {"name": "status", "type": "text", "desc": "`ACTIVE` / `DISABLED`"}, {"name": "export_granted", "type": "boolean", "desc": "是否授予数据导出（`canExportData` 的来源，K12）"}, {"name": "revision", "type": "bigint", "desc": "乐观锁；角色、状态、导出权限、基本信息的修改都带「revision 等于读到的值」"}, {"name": "deleted_at", "type": "timestamptz", "desc": "移除账号（OH-IAM-F012）的软删除标记；空为未移除"}], "notes": ["约束：`employee_no` 在未移除的账号中唯一（部分唯一索引，条件 `deleted_at IS NULL`）；`role`、`status` 有 `CHECK`。", "索引：`employee_no`（登录按工号找账号）。用户列表（OH-IAM-F003）按创建时间分页，不另建索引。", "说明：状态、角色、导出权限变更与对应事件（C20、C17）在同一事务里写入事件发布登记表。已移除的账号不再出现在用户列表，判权一律拒绝。"], "rfc": "0006", "intro": "对应 `UserInfo`（第 2.1 节）。用户 ID 是稳定的 `usr_` ID，工号不直接充当用户 ID（Q03）。`user_credentials` 和 `web_sessions` 只服务本地登录，Q03 定了再补。"}, {"module": "M07", "name": "user_credentials", "prefix": "ucr_", "desc": "本地账号的密码哈希", "write": "可更新", "retention": "随账号；账号移除后由本模块定时任务删除", "columns": [{"name": "id", "type": "text", "desc": "主键"}, {"name": "user_id", "type": "text", "desc": "外键 → `users.id`，唯一"}, {"name": "password_hash", "type": "text", "desc": "密码哈希（带算法与盐的编码）；明文不入库"}, {"name": "password_updated_at", "type": "timestamptz", "desc": "最近一次设置或修改密码的时间"}], "notes": [], "rfc": "0006"}, {"module": "M07", "name": "web_sessions", "prefix": "wss_", "desc": "cookie 会话", "write": "可更新", "retention": "过期或作废后由本模块定时任务删除；保留天数按 RFC-0001 Q14", "columns": [{"name": "id", "type": "text", "desc": "主键"}, {"name": "user_id", "type": "text", "desc": "外键 → `users.id`"}, {"name": "session_hash", "type": "text", "desc": "cookie 里的会话 ID 的哈希，唯一；cookie 值本身不入库"}, {"name": "expires_at", "type": "timestamptz", "desc": "过期时间；过期后 `resolveWebSession` 返回 `identity.session-expired`"}, {"name": "revoked_at", "type": "timestamptz", "desc": "退出登录（OH-IAM-F009）时写入；空为有效"}], "notes": ["索引：`session_hash`（唯一，服务 `resolveWebSession` 按会话查主体；T02 缓存 30 秒，所以这条查询不是每次请求都走库）；`user_id`（账号停用、移除时批量作废该用户的会话）。", "说明：账号为 `DISABLED` 时 `resolveWebSession` 返回 `identity.user-disabled`，账号移除后会话视为不存在。登录失败只发审计事件（C17），不落表。"], "rfc": "0006"}, {"module": "M07", "name": "eval_accounts", "prefix": "eac_", "desc": "评估账号（三档，不能登录）", "write": "可更新（乐观锁）", "retention": "长期；停用不删", "columns": [{"name": "id", "type": "text", "desc": "主键，即 `evalAccountId`"}, {"name": "tier", "type": "text", "desc": "`TIER_1` / `TIER_2` / `TIER_3`"}, {"name": "name", "type": "text", "desc": "显示名"}, {"name": "status", "type": "text", "desc": "`ACTIVE` / `DISABLED`"}, {"name": "revision", "type": "bigint", "desc": "乐观锁"}], "notes": [], "rfc": "0006", "intro": "对应 `EvalAccount`（第 2.1 节）：评估账号由数据平台开通，在这里登记，不能登录，只能被评估会话使用。"}, {"module": "M07", "name": "identity_mappings", "prefix": "idm_", "desc": "本地用户、评估账号到取数网关身份、知识服务身份的映射", "write": "可更新（乐观锁）", "retention": "长期", "columns": [{"name": "id", "type": "text", "desc": "主键"}, {"name": "user_id", "type": "text", "desc": "外键 → `users.id`，可空"}, {"name": "eval_account_id", "type": "text", "desc": "外键 → `eval_accounts.id`，可空"}, {"name": "gateway_user_id", "type": "text", "desc": "取数网关身份（`Mapped.gatewayUserId`）"}, {"name": "knowledge_uid", "type": "text", "desc": "知识服务身份（`Mapped.knowledgeUid`），可空"}, {"name": "revision", "type": "bigint", "desc": "乐观锁"}], "notes": ["约束：`user_id` 与 `eval_account_id` 恰有一个非空（`CHECK`）；各自唯一（部分唯一索引）；`gateway_user_id` 唯一，同一个行内 uid 不绑给两个主体。`EvalAccount.gatewayMapped` 是计算出来的：该评估账号有映射行即为 `true`。", "说明：`getGatewayIdentity` 按主体查映射：有行返回 `Mapped`，没有行返回 `Unmapped`，账号 `DISABLED` 或 `service` 主体返回 `NotAllowed` 新", "retention": "释放或收回后按 RFC-0001 Q14，由本模块定时任务删除", "columns": [{"name": "id", "type": "text", "desc": "主键，即 `slotId`"}, {"name": "execution_id", "type": "text", "desc": "执行 ID（M01 的对象，只存 ID）"}, {"name": "session_id", "type": "text", "desc": "会话 ID"}, {"name": "session_kind", "type": "text", "desc": "`USER` / `ASSISTANT` / `EVOLUTION` / `EVALUATION`"}, {"name": "pool", "type": "text", "desc": "`USER` / `BACKGROUND`，由 `session_kind` 决定，写入时落下，统计和计数直接用"}, {"name": "agent_id、model_id", "type": "text", "desc": "占位时的 Agent 和模型"}, {"name": "status", "type": "text", "desc": "`HELD` / `RELEASED` / `EXPIRED`"}, {"name": "lease_expires_at", "type": "timestamptz", "desc": "租约到期时间，用数据库 `now()` 计算和比较，不用应用时钟"}], "notes": ["约束：同一个 `execution_id` 同时最多一行 `HELD`（部分唯一索引）；重复调用 `acquireSlot` 且已有 `HELD` 行的租约未过期时，返回已有名额并重置租约，不多占。`pool`、`status` 有 `CHECK`。", "并发与计数：占位事务先取该池的事务级 advisory lock；该执行已有 `HELD` 行且 `lease_expires_at > now()` 时复用并重置租约；已有 `HELD` 行但租约已过期时，在这把锁里先把它置为 `EXPIRED`，再按新占位走下面的计数。计数时数该池 `status = 'HELD'` 且 `lease_expires_at > now()` 的行，小于 `admin_settings` 里的池上限才插入，否则返回 `SlotPoolFull`。到期未续的行即使还没被标记，也已不计入占用；定时任务把它们置为 `EXPIRED`。", "`renewSlot`：只更新 `status = 'HELD'` 且租约未过期的行，更新不到就返回 `operations.slot-expired`。`releaseSlot`：把行置为 `RELEASED`，行已是 `RELEASED` 或 `EXPIRED` 时同样返回 `RELEASED`（幂等）。", "索引：`(pool, status, lease_expires_at)`（占位计数、过期收回）；`execution_id`。"], "rfc": "0007"}, {"module": "M08", "name": "usage_ledger", "prefix": "usg_", "desc": "用量账本", "write": "只追加", "retention": "按 RFC-0001 Q14，由属主角色的清理任务整批删", "columns": [{"name": "id", "type": "text", "desc": "主键"}, {"name": "correlation_id", "type": "text", "desc": "`UsageReceipt.correlationId`（DSH 模型调用 ID 或 M03 的 `dataCallId`），唯一，去重键"}, {"name": "source", "type": "text", "desc": "`DSH_MODEL` / `DATA_GATEWAY`"}, {"name": "session_id、execution_id", "type": "text", "desc": "会话 ID、执行 ID"}, {"name": "session_kind", "type": "text", "desc": "`USER` / `ASSISTANT` / `EVOLUTION` / `EVALUATION`，用于按会话种类分开统计"}, {"name": "user_id", "type": "text", "desc": "本人用量的过滤列：主体是用户为其 ID，接入应用为 `actingUserId`，评估账号和 `service` 主体为空"}, {"name": "principal", "type": "jsonb", "desc": "`Principal` 快照，只展示，不查询"}, {"name": "model_id", "type": "text", "desc": "可为空（`DATA_GATEWAY` 回执没有模型）"}, {"name": "calls、input_tokens、output_tokens、duration_ms", "type": "bigint", "desc": "取不到的字段为 null，不记 0"}, {"name": "tool_calls", "type": "bigint", "desc": "本次 turn 的 tool 调用次数（`UsageReceipt.toolCalls`）；取不到为 null，`DATA_GATEWAY` 回执为 null"}, {"name": "occurred_at", "type": "timestamptz", "desc": "`UsageReceipt.occurredAt`"}], "notes": ["约束：`correlation_id` 唯一，写入用 `INSERT … ON CONFLICT (correlation_id) DO NOTHING`，重复回执不重复计数；运行角色不授 `UPDATE`、`DELETE`；不存会话正文和凭据。", "汇总口径：求和时 null 不当 0 参与，任一回执在某项上为 null，该会话或执行的汇总 `complete` 为 `false`；`DATA_GATEWAY` 回执的 `tool_calls` 本来就没有值，不算未知，只有 `DSH_MODEL` 回执的 `tool_calls` 为 null 才使 `complete` 为 `false`。", "索引：`session_id`（个人用量、限额扣减）；`execution_id`（管理员按执行查）；`(user_id, occurred_at)`（本人用量合计）；`occurred_at`（时间范围查询与过期清理）。"], "rfc": "0007"}, {"module": "M08", "name": "recommended_questions", "prefix": "rcq_", "desc": "首页推荐问题", "write": "可更新", "retention": "长期", "columns": [{"name": "id", "type": "text", "desc": "主键"}, {"name": "question", "type": "text", "desc": "问题文本"}, {"name": "sort_order", "type": "int", "desc": "展示顺序"}, {"name": "enabled", "type": "boolean", "desc": "是否在首页展示"}], "notes": ["索引：`(enabled, sort_order)`（首页取列表）。"], "rfc": "0007"}, {"module": "T04", "name": "platform_dsh_processes", "prefix": "", "desc": "DSH 进程登记与每进程服务密钥", "write": "可更新", "retention": "进程停止后 30 天", "columns": [{"name": "id", "type": "text", "desc": "主键，前缀 `dsp_`，T04 生成"}, {"name": "process_id", "type": "text", "desc": "守护程序拉起进程时分配，也是连接 ID（回调里的 `dshConnectionId`）；拉起前为空，非空时唯一"}, {"name": "route_key", "type": "text", "desc": "路由键（第 2.2 节五种之一）；单进程部署时只有一行，记 `*`（Q9）"}, {"name": "dsh_host", "type": "text", "desc": "所在 DSH 主机（守护程序的标识）"}, {"name": "address", "type": "text", "desc": "进程地址（守护程序返回）"}, {"name": "status", "type": "text", "desc": "`starting` / `ready` / `stopped`"}, {"name": "service_key_enc", "type": "bytea", "desc": "每进程服务密钥的密文（内核 `secrets` 信封加密，带密钥版本）；进程停止时清空"}, {"name": "process_token_id", "type": "text", "desc": "交给这个进程的 MCP 用户令牌在 M07 的 ID（`ptk_` 前缀），只存 ID，不存令牌"}, {"name": "token_revoked_at", "type": "timestamptz", "desc": "令牌作废成功的时间"}, {"name": "started_at、stopped_at", "type": "timestamptz", "desc": "拉起、停止时间"}, {"name": "stop_reason", "type": "text", "desc": "`recycled`（M01 回收）/ `restarted`（重启换新实例）/ `lost`（守护程序报告进程不在）/ `orphaned`（进程在跑但没有登记，见下）"}], "notes": ["**先落记录再调守护程序**：确保进程时，T04 先生成服务密钥、经 M07 领进程令牌，插入 `starting` 行（带密文和令牌 ID），再调守护程序；返回后补填 `process_id`、`address`，置为 `ready`。T04 在调用前后退出时，`starting` 行留在库里，下次确保进程时接着处理。", "**一个路由键同时只有一个活着的进程**：（`dsh_host`, `route_key`）在 `status` 为 `starting`、`ready` 的行上唯一。", "**没有登记的进程不用**：守护程序返回的进程在本表里没有对应的 `ready` 行（例如上次 T04 在补填前退出），T04 让守护程序回收它，记一行 `orphaned`，再按上面的步骤重新拉起。这样不会有进程带着库里查不到的密钥运行。", "**轮换就是换一行**：进程重启时守护程序分配新的进程 ID，T04 生成新密钥、领新令牌、插入新行；旧行标 `stopped`、清空密钥，旧密钥立即失效。", "**令牌随进程作废**：把行标为 `stopped` 的同一流程里，T04 调 M07 `revokeProcessToken(process_token_id)`，成功后写 `token_revoked_at`；失败的由 T03 的清理任务按「`stopped` 且 `token_revoked_at` 为空」重试。", "**连接登记查询**（第 3.8 节）只返回 `ready` 的行；`secretRef` 形如 `dsh-process:<processId>`，由内核 `secrets` 解析：读这一行的 `service_key_enc` 并解密。", "**不存的东西**：DSH 启动令牌、cookie（只在内存，第 3.7 节）；MCP 用户令牌本身（M07 只存哈希）；应装清单（在守护程序）。", "**保留**：停止且令牌已作废后 30 天，供排查，由 T03 的清理任务删除（RFC-0004 第 3.6 节）。"], "rfc": "0002", "intro": "DSH 进程登记，一个进程实例一行。"}];

</script>
<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NODE=Object.fromEntries(NODES.map(n=>[n.id,n]));
NODE.BIZ={id:'BIZ',name:'业务模块（9 个）',short:'业务模块',kind:'group',owner:'外部',x:GROUP_BIZ.x,y:GROUP_BIZ.y,w:GROUP_BIZ.w,h:GROUP_BIZ.h,desc:GROUP_BIZ.label,funcs:[]};
const nm=id=>NODE[id]?(NODE[id].short||NODE[id].name):id;
const fullName=id=>NODE[id]?NODE[id].name:id;

/* ---------- 连接 ---------- */
const edgeMap=new Map();
function addEdge(from,to,kind,item,label){
  if(from===to) return;
  const k=from+'|'+to+'|'+kind;
  if(!edgeMap.has(k)) edgeMap.set(k,{id:'e'+edgeMap.size,from,to,kind,contracts:[],items:[],labels:[],fold:false,src:item?'contract':'extra'});
  const e=edgeMap.get(k);
  if(item){ if(!e.contracts.includes(item.c)) e.contracts.push(item.c); e.items.push(item); }
  if(label) e.labels.push(label);
}
CONTRACTS.forEach(c=>c.items.forEach(it=>{
  const item={c:c.id,cname:c.name,iface:it.iface,methods:it.methods,note:it.note||'',event:!!c.event};
  if(c.event){ (c.eventFrom||[c.provider]).forEach(f=>it.users.forEach(u=>addEdge(f,u,'event',item))); }
  else it.users.forEach(u=>addEdge(u,c.provider,'call',item));
}));
const CONTRACT_EDGES=[...edgeMap.values()];
CONTRACT_EDGES.forEach(e=>{
  if(e.to==='M07'&&e.items.every(i=>i.iface==='PermissionQuery')) e.fold=true;
  if(e.to==='M09'&&e.contracts.length===1&&e.contracts[0]==='C17') e.fold=true;
});
EXTRA_EDGES.forEach(x=>addEdge(x.from,x.to,x.kind,null,x.label));
const ALL_EDGES=[...edgeMap.values()];

/* ---------- 表 ---------- */
const TABLE_STATUS=t=>t.status||(t.module==='M07'?'讨论中':'原设计');
const GROUPS=[{id:'FW',name:'框架（RFC-0004，文韬）',owner:'文韬',tables:FRAME_TABLES.map(t=>Object.assign({fw:true},t))}];
const t04=TABLES.filter(t=>t.module==='T04');
GROUPS[0].tables.push(...t04.map(t=>Object.assign({owner:'闻洛',status:'原设计',fwNote:'DSH 适配层的表（RFC-0002，闻洛）'},t)));
['M01','M02','M03','M04','M05','M06','M07','M08','M09'].forEach(m=>{
  GROUPS.push({id:m,name:NODE[m].name+'（RFC-'+NODE[m].rfc+'，'+NODE[m].owner+'）',owner:NODE[m].owner,tables:TABLES.filter(t=>t.module===m)});
});
const tablesOf=id=>{
  if(id==='T02'||id==='T03'||id==='KER'||id==='DB') return GROUPS[0].tables.filter(t=>t.fw);
  if(id==='T04') return t04;
  const g=GROUPS.find(g=>g.id===id); return g?g.tables:[];
};

/* ---------- 状态 ---------- */
const st={view:'overview',sel:null,selEdge:null,hover:null,tour:null,step:0,fold:false,owner:'',phase:'',status:'',zoom:1,openCard:null,selContract:null};

/* ---------- 图形 ---------- */
const DEP_POS={T02:[380,20,340],M03:[120,140],M06:[660,140],M01:[390,260],M04:[700,380],M02:[30,500],M05:[300,500],M08:[570,500],M09:[840,500],M07:[390,620],T04:[300,740,500]};
function geom(id,view){
  const n=NODE[id];
  if(view==='dep'){ const p=DEP_POS[id]; if(!p) return null; return {x:p[0],y:p[1],w:p[2]||240,h:50}; }
  return {x:n.x,y:n.y,w:n.w,h:n.h};
}
function anchor(g,tx,ty){
  const cx=g.x+g.w/2, cy=g.y+g.h/2, dx=tx-cx, dy=ty-cy;
  if(dx===0&&dy===0) return [cx,cy];
  const sx=(g.w/2)/Math.abs(dx||1e-9), sy=(g.h/2)/Math.abs(dy||1e-9), s=Math.min(sx,sy);
  return [cx+dx*s, cy+dy*s];
}
function matchFilter(n){
  if(!n||n.kind==='actor'||n.kind==='external'||n.kind==='group') return true;
  if(st.owner&&n.owner!==st.owner) return false;
  if(st.phase&&n.phase!==st.phase) return false;
  if(st.status&&n.status!==st.status) return false;
  return true;
}
function edgeVisible(e,view){
  if(view==='dep'){ if(!DEP_POS[e.from]||!DEP_POS[e.to]) return false; if(e.src!=='contract') return false; }
  if(e.fold&&!st.fold) return false;
  const k=$('#kind-'+e.kind); if(k&&!k.checked) return false;
  return true;
}
function render(view){
  const svgId=view==='dep'?'#svg-dep':'#svg-ov';
  const W=view==='dep'?1100:1300, H=view==='dep'?810:950;
  const ids=view==='dep'?Object.keys(DEP_POS):NODES.map(n=>n.id);
  const edges=ALL_EDGES.filter(e=>edgeVisible(e,view));
  // 同一对节点多条线时错开
  const pairCount={},pairIdx={};
  edges.forEach(e=>{const k=[e.from,e.to].sort().join('|'); pairCount[k]=(pairCount[k]||0)+1;});
  let s='<defs>'+Object.entries(KINDS).map(([k,v])=>`<marker id="ar-${k}-${view}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${v.color}"/></marker>`).join('')+'</defs>';
  if(view!=='dep'){ const g=GROUP_BIZ; s+=`<g class="grp" data-node="BIZ"><rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="14"/><text x="${g.x+14}" y="${g.y+g.h-12}">${esc(g.label)}</text></g>`; }
  s+='<g class="edges">';
  edges.forEach(e=>{
    const ga=geom(e.from,view), gb=geom(e.to,view); if(!ga||!gb) return;
    const k=[e.from,e.to].sort().join('|'); pairIdx[k]=(pairIdx[k]||0); const i=pairIdx[k]++, n=pairCount[k];
    const ca=[ga.x+ga.w/2,ga.y+ga.h/2], cb=[gb.x+gb.w/2,gb.y+gb.h/2];
    const a=anchor(ga,cb[0],cb[1]), b=anchor(gb,ca[0],ca[1]);
    const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||1;
    const sign=e.from<e.to?1:-1;
    const off=((i-(n-1)/2)*30+ (n===1?14:0))*sign;
    const mx=(a[0]+b[0])/2 - dy/len*off, my=(a[1]+b[1])/2 + dx/len*off;
    const kd=KINDS[e.kind];
    const label=e.contracts.length?e.contracts.join('、'):(e.labels[0]||'');
    const lx=(a[0]+2*mx+b[0])/4, ly=(a[1]+2*my+b[1])/4;
    s+=`<g class="edge k-${e.kind} ${e.src==='contract'?'ce':''}" data-edge="${e.id}" data-from="${e.from}" data-to="${e.to}">
      <path class="hit" d="M${a[0]},${a[1]} Q${mx},${my} ${b[0]},${b[1]}"/>
      <path class="ln" d="M${a[0]},${a[1]} Q${mx},${my} ${b[0]},${b[1]}" stroke="${kd.color}" stroke-dasharray="${kd.dash}" marker-end="url(#ar-${e.kind}-${view})"/>
      <g class="lbl"><rect x="${lx-label.length*3.6-4}" y="${ly-9}" width="${label.length*7.2+8}" height="16" rx="3"/><text x="${lx}" y="${ly+3}">${esc(label)}</text></g></g>`;
  });
  s+='</g><g class="nodes">';
  ids.forEach(id=>{
    const n=NODE[id], g=geom(id,view); if(!g) return;
    const col=OWNERS[n.owner]||'#6b7280';
    const stc=n.status?STATUS[n.status].c:null;
    s+=`<g class="node kind-${n.kind}" data-node="${id}"><rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="9" style="--oc:${col}"/>
      <rect class="bar" x="${g.x}" y="${g.y}" width="6" height="${g.h}" rx="3" fill="${col}"/>
      <text class="nt" x="${g.x+16}" y="${g.y+(n.kind==='module'||n.kind==='framework'||n.kind==='store'||n.kind==='process'?22:g.h/2+5)}">${esc(n.name)}</text>`;
    if(n.kind!=='actor'&&n.kind!=='external') s+=`<text class="ns" x="${g.x+16}" y="${g.y+40}">${esc(n.owner)}${n.rfc?' · RFC-'+n.rfc:''}${n.phase?' · '+n.phase:''}</text>`;
    if(stc) s+=`<circle cx="${g.x+g.w-14}" cy="${g.y+14}" r="5" fill="${stc}"><title>${esc(n.status)}</title></circle>`;
    s+='</g>';
  });
  s+='</g>';
  const svg=$(svgId); svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.style.width=(W*st.zoom)+'px'; svg.innerHTML=s;
  applyHL(view);
}
function applyHL(view){
  const svg=$(view==='dep'?'#svg-dep':'#svg-ov'); if(!svg) return;
  let hlN=null,hlE=null;
  if(st.tour){ const stp=TOURS.find(t=>t.id===st.tour).steps[st.step]; hlN=new Set(stp.nodes); hlE=stp.edges.map(p=>p.join('|')); }
  else if(st.selEdge){ const e=ALL_EDGES.find(x=>x.id===st.selEdge); hlN=new Set([e.from,e.to]); hlE=[e.id]; }
  else if(st.selContract){ hlN=new Set(); hlE=[]; ALL_EDGES.forEach(e=>{ if(e.contracts.includes(st.selContract)){hlE.push(e.id);hlN.add(e.from);hlN.add(e.to);} }); }
  else { const f=st.hover||st.sel; if(f){ hlN=new Set([f]); hlE=[]; ALL_EDGES.forEach(e=>{ if(e.from===f||e.to===f){hlE.push(e.id);hlN.add(e.from);hlN.add(e.to);} }); } }
  svg.querySelectorAll('.node').forEach(g=>{
    const id=g.dataset.node; const n=NODE[id];
    g.classList.toggle('dim', (hlN&&!hlN.has(id)) || (!hlN&&!matchFilter(n)));
    g.classList.toggle('hl', !!(hlN&&hlN.has(id)));
    g.classList.toggle('sel', st.sel===id);
  });
  svg.querySelectorAll('.edge').forEach(g=>{
    const on=hlE&&(hlE.includes(g.dataset.edge)||hlE.includes(g.dataset.from+'|'+g.dataset.to));
    const filt=!hlN&&(!matchFilter(NODE[g.dataset.from])||!matchFilter(NODE[g.dataset.to]));
    g.classList.toggle('hl',!!on); g.classList.toggle('dim',(hlE&&!on)||filt);
  });
  const grp=svg.querySelector('.grp'); if(grp) grp.classList.toggle('hl',!!(hlN&&hlN.has('BIZ')));
}

/* ---------- 详情面板 ---------- */
function badge(s){ return s&&STATUS[s]?`<span class="badge" style="background:${STATUS[s].c}" title="${esc(STATUS[s].d)}">${esc(s)}</span>`:''; }
function ownerChip(o){ return `<span class="chip" style="background:${OWNERS[o]||'#6b7280'}">${esc(o)}</span>`; }
function showNode(id){
  const n=NODE[id]; if(!n) return;
  const prov=CONTRACTS.filter(c=>c.provider===id);
  const used=CONTRACTS.filter(c=>c.items.some(i=>i.users.includes(id))||(c.eventFrom||[]).includes(id));
  const outs=ALL_EDGES.filter(e=>e.from===id), ins=ALL_EDGES.filter(e=>e.to===id);
  const tbs=tablesOf(id);
  let h=`<h2>${esc(n.name)}</h2><div class="meta">${ownerChip(n.owner)} ${badge(n.status)} ${n.rfc?'RFC-'+n.rfc:''} ${n.phase?'· 从 '+n.phase+' 开始':''}</div><p>${esc(n.desc)}</p>`;
  if(n.funcs&&n.funcs.length) h+=`<h3>功能</h3><ul>${n.funcs.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`;
  if(prov.length) h+=`<h3>它提供的契约</h3><ul>${prov.map(c=>`<li><a data-contract="${c.id}">${c.id} ${esc(c.name)}</a>${c.event?' <i>事件</i>':''}</li>`).join('')}</ul>`;
  if(used.length) h+=`<h3>它使用 / 发出的契约</h3><ul>${used.filter(c=>c.provider!==id).map(c=>`<li><a data-contract="${c.id}">${c.id} ${esc(c.name)}</a>（${esc(nm(c.provider))}）</li>`).join('')}</ul>`;
  const el=(e,dir)=>`<li><a data-edge="${e.id}">${dir==='out'?'→ '+esc(nm(e.to)):'← '+esc(nm(e.from))}</a> <span class="kd" style="color:${KINDS[e.kind].color}">${KINDS[e.kind].name}</span> ${esc(e.contracts.join('、')||e.labels[0]||'')}</li>`;
  if(outs.length) h+=`<h3>它连向谁</h3><ul>${outs.map(e=>el(e,'out')).join('')}</ul>`;
  if(ins.length) h+=`<h3>谁连向它</h3><ul>${ins.map(e=>el(e,'in')).join('')}</ul>`;
  if(tbs.length) h+=`<h3>它的表（${tbs.length}）</h3><ul class="tl">${tbs.map(t=>`<li><a data-table="${esc(t.name)}">${esc(t.name)}</a> <span class="mut">${esc(t.desc||'')}</span></li>`).join('')}</ul>`;
  else if(n.kind==='module') h+=`<h3>它的表</h3><p class="mut">原 RFC 还没写（开工前补）。</p>`;
  $('#panel').innerHTML=h;
}
function showEdge(eid){
  const e=ALL_EDGES.find(x=>x.id===eid); if(!e) return;
  let h=`<h2>${esc(nm(e.from))} → ${esc(nm(e.to))}</h2><div class="meta"><span class="chip" style="background:${KINDS[e.kind].color}">${KINDS[e.kind].name}</span></div>`;
  if(e.labels.length) h+=`<p>${e.labels.map(esc).join('<br>')}</p>`;
  if(e.items.length){
    h+='<h3>经过的契约</h3>'+e.items.map(i=>`<div class="ci"><b><a data-contract="${i.c}">${i.c} ${esc(i.cname)}</a></b>${i.event?' <i>事件</i>':''}<div><code>${esc(i.iface)}</code></div><div class="mut">${esc(i.methods)}</div>${i.note?`<div>${esc(i.note)}</div>`:''}</div>`).join('');
    const c=CONTRACTS.find(c=>c.id===e.contracts[0]); if(c) h+=`<p class="mut">定义在 RFC-${esc(c.rfc)}</p>`;
  }
  if(e.fold) h+='<p class="mut">这类连线所有模块都有，全景图默认收起（顶部勾选可显示）。</p>';
  $('#panel').innerHTML=h;
}
function showContract(cid){
  const c=CONTRACTS.find(x=>x.id===cid); if(!c) return;
  let h=`<h2>${c.id} ${esc(c.name)}</h2><div class="meta">${c.event?'<span class="chip" style="background:#d97706">事件</span>':'<span class="chip" style="background:#334155">接口</span>'} 提供方：${esc(fullName(c.provider))} ${ownerChip(NODE[c.provider].owner)}</div>`;
  if(c.eventFrom) h+=`<p>发出方：${c.eventFrom.map(nm).map(esc).join('、')}</p>`;
  h+=c.items.map(i=>`<div class="ci"><code>${esc(i.iface)}</code><div class="mut">${esc(i.methods)}</div><div>${c.event?'订阅方':'使用方'}：${i.users.map(u=>`<a data-node="${u}">${esc(nm(u))}</a>`).join('、')}</div>${i.note?`<div>${esc(i.note)}</div>`:''}</div>`).join('');
  h+=`<p class="mut">定义在 RFC-${esc(c.rfc)}</p>`;
  $('#panel').innerHTML=h;
}

/* ---------- 视图：表 ---------- */
function renderTables(){
  const q=($('#tq').value||'').trim().toLowerCase();
  let h='';
  GROUPS.forEach(g=>{
    if(st.owner&&g.owner!==st.owner&&!(g.id==='FW'&&st.owner==='闻洛')) return;
    let tbs=g.tables.filter(t=>!st.status||TABLE_STATUS(t)===st.status);
    if(q) tbs=tbs.filter(t=>(t.name+' '+(t.desc||'')+' '+(t.columns||[]).map(c=>Array.isArray(c)?c.join(' '):c.name+' '+c.desc).join(' ')).toLowerCase().includes(q));
    if(q&&!tbs.length) return;
    h+=`<details class="tg" open data-group="${g.id}"><summary>${ownerChip(g.owner)} <b>${esc(g.name)}</b> <span class="mut">${tbs.length} 张</span></summary>`;
    if(!g.tables.length) h+='<p class="mut pad">原 RFC 还没写这个模块的表（开工前补）。</p>';
    tbs.forEach(t=>{
      const s=TABLE_STATUS(t);
      const newName=(!t.fw&&SCHEMA[t.module]&&!t.name.startsWith('platform_'))?SCHEMA[t.module]+'_'+t.name:'';
      h+=`<details class="tb" data-table="${esc(t.name)}"><summary><code class="tn">${esc(t.name)}</code> ${badge(s)} <span>${esc(t.desc||'')}</span> <span class="mut">${t.retention?'· 保留：'+esc(t.retention):''}</span></summary><div class="tbody">`;
      if(t.fwNote) h+=`<p class="mut">${esc(t.fwNote)}</p>`;
      if(newName) h+=`<p class="mut">一个库后的表名：<code>${esc(newName)}</code>（按改写规则加前缀；列类型待从 PostgreSQL 写法改成 MySQL 写法）</p>`;
      if(t.module==='M07') h+=`<p class="mut">身份权限正在新对话里讨论（设计详解第 20 节）：建议把身份映射并进账号表、密码表加锁定相关列等，未定。</p>`;
      if(t.write) h+=`<p class="mut">写法：${esc(t.write)}${t.prefix?' · ID 前缀 '+esc(t.prefix):''}</p>`;
      if(t.intro) h+=`<p>${esc(t.intro.replace(/`/g,''))}</p>`;
      if(t.columns&&t.columns.length){
        h+='<table><tr><th>列</th><th>类型</th><th>说明</th></tr>'+t.columns.map(c=>{const r=Array.isArray(c)?c:[c.name,c.type,c.desc]; return `<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td><td>${esc(String(r[2]).replace(/`/g,''))}</td></tr>`;}).join('')+'</table>';
      }
      if(t.notes&&t.notes.length) h+='<ul>'+t.notes.map(x=>`<li>${esc(x.replace(/`/g,''))}</li>`).join('')+'</ul>';
      h+='</div></details>';
    });
    h+='</details>';
  });
  $('#tables').innerHTML=h||'<p class="mut pad">没有匹配的表。</p>';
}
function openTable(name){
  setView('tables');
  setTimeout(()=>{ const d=document.querySelector(`details.tb[data-table="${CSS.escape(name)}"]`); if(d){ d.open=true; d.parentElement.open=true; d.scrollIntoView({block:'center'}); d.classList.add('flash'); setTimeout(()=>d.classList.remove('flash'),1500);} },30);
}

/* ---------- 视图：契约 ---------- */
function renderContracts(){
  let h='<table class="ct"><tr><th>编号</th><th>名称</th><th>类型</th><th>提供方 / 定义方</th><th>使用方 / 订阅方</th><th>内容</th></tr>';
  CONTRACTS.forEach(c=>{
    const p=NODE[c.provider]; if(st.owner&&p.owner!==st.owner) return;
    const users=[...new Set(c.items.flatMap(i=>i.users))];
    h+=`<tr data-contract="${c.id}"><td><b>${c.id}</b></td><td>${esc(c.name)}</td><td>${c.event?'事件':'接口'}</td><td>${ownerChip(p.owner)} ${esc(nm(c.provider))}${c.eventFrom?`<div class="mut">发出方：${c.eventFrom.map(nm).map(esc).join('、')}</div>`:''}</td><td>${users.map(nm).map(esc).join('、')}</td><td>${c.items.map(i=>`<div><code>${esc(i.iface)}</code> <span class="mut">${esc(i.methods)}</span></div>`).join('')}</td></tr>`;
  });
  $('#contracts').innerHTML=h+'</table><p class="mut pad">点一行：右侧显示详情，并在「模块依赖」图里高亮这条契约。C06、C11、C13 是工具回调入口（读知识、问数、登记产出），由 API 入口转交，不在模块之间。</p>';
}

/* ---------- 视图：机制 ---------- */
function renderMechs(){
  $('#mechs').innerHTML=MECHS.filter(m=>!st.status||m.s===st.status).map((m,i)=>`<div class="card"><div class="ch"><b>${esc(m.t)}</b> ${badge(m.s)}<span class="mut ref">${esc(m.ref)}</span></div><p>${esc(m.one)}</p>${m.tables.length?`<div class="tch">${m.tables.map(t=>t==='全部'?'<span class="tg2">所有表</span>':`<a class="tg2" data-table="${esc(t)}">${esc(t)}</a>`).join('')}</div>`:''}${m.more.length?`<details><summary>展开</summary><ul>${m.more.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`:''}</div>`).join('');
}
/* ---------- 视图：待定 ---------- */
function renderPending(){
  $('#pending').innerHTML=PENDING.map(g=>`<div class="pg"><h3>${esc(g.g)}</h3>${g.items.map(i=>`<div class="pi" data-node="${i.node}"><b>${esc(i.id)}</b> ${esc(i.t)} ${i.who.map(w=>OWNERS[w]?ownerChip(w):`<span class="chip" style="background:#475569">${esc(w)}</span>`).join(' ')}</div>`).join('')}</div>`).join('')+
  '<p class="mut pad">完整内容见笔记仓库 OntoHelm平台RFC/给组长的问题清单.md、修改记录.md。</p>';
}

/* ---------- 切换与交互 ---------- */
function setView(v){
  st.view=v; $('#tools').style.visibility=(v==='overview'||v==='dep')?'visible':'hidden'; $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===v)); $$('.view').forEach(d=>d.classList.toggle('on',d.id==='v-'+v));
  refresh();
}
function refresh(){
  closeCard();
  if(st.view==='overview') render('ov');
  if(st.view==='dep') render('dep');
  if(st.view==='tables') renderTables();
  if(st.view==='contracts') renderContracts();
  if(st.view==='mechs') renderMechs();
  if(st.view==='pending') renderPending();
}
function closeCard(){ const c=$('#card'); c.style.display='none'; st.openCard=null; }
function openCard(id,evt){
  const n=NODE[id]; if(!n||!n.funcs||!n.funcs.length){ closeCard(); return; }
  const c=$('#card'); st.openCard=id;
  c.innerHTML=`<div class="cardh"><b>${esc(n.name)}</b><span class="x">收起 ✕</span></div><ul>${n.funcs.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`;
  const wrap=$('#v-'+st.view).getBoundingClientRect();
  const g=evt.target.closest('.node').getBoundingClientRect();
  c.style.display='block';
  let left=g.right+8-wrap.left+$('#v-'+st.view).scrollLeft, top=g.top-wrap.top+$('#v-'+st.view).scrollTop;
  if(g.right+330>window.innerWidth) left=g.left-330-wrap.left+$('#v-'+st.view).scrollLeft;
  c.style.left=Math.max(4,left)+'px'; c.style.top=top+'px';
  $('#v-'+st.view).appendChild(c);
}
document.addEventListener('mouseover',e=>{
  const g=e.target.closest('svg .node'); const v=st.view==='dep'?'dep':'ov';
  const id=g?g.dataset.node:null; if(id!==st.hover){ st.hover=id; if(st.view==='overview'||st.view==='dep') applyHL(v); }
});
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#card .x')){ closeCard(); return; }
  const tab=t.closest('.tab'); if(tab){ setView(tab.dataset.view); return; }
  const a=t.closest('[data-table]'); if(a&&!t.closest('details.tb > summary')&&!t.closest('details.tb')){ openTable(a.dataset.table); return; }
  const ca=t.closest('a[data-contract], tr[data-contract]'); if(ca){ st.selContract=ca.dataset.contract; st.sel=null; st.selEdge=null; showContract(ca.dataset.contract); if(t.closest('tr[data-contract]')){ setView('dep'); } else applyHL(st.view==='dep'?'dep':'ov'); return; }
  const ea=t.closest('[data-edge]'); if(ea){ st.selEdge=ea.dataset.edge; st.sel=null; st.selContract=null; showEdge(ea.dataset.edge); applyHL(st.view==='dep'?'dep':'ov'); return; }
  const na=t.closest('[data-node]');
  if(na){ const id=na.dataset.node;
    if(na.classList.contains('pi')||na.tagName==='A'){ if(st.view!=='overview'&&st.view!=='dep') setView('overview'); }
    st.sel=(st.sel===id&&!na.tagName.match(/^A$/))?null:id; st.selEdge=null; st.selContract=null;
    if(st.sel){ showNode(id); if(na.classList.contains('node')) openCard(id,e); else closeCard(); } else closeCard();
    applyHL(st.view==='dep'?'dep':'ov'); return; }
  if(t.closest('svg')){ st.sel=null; st.selEdge=null; st.selContract=null; closeCard(); applyHL(st.view==='dep'?'dep':'ov'); }
});
['owner','phase','status'].forEach(k=>$('#f-'+k).addEventListener('change',e=>{ st[k]=e.target.value; refresh(); }));
$('#f-fold').addEventListener('change',e=>{ st.fold=e.target.checked; refresh(); });
$$('.kindcb').forEach(cb=>cb.addEventListener('change',refresh));
$('#tq').addEventListener('input',renderTables);
$('#zin').onclick=()=>{st.zoom=Math.min(2.5,st.zoom*1.2);refresh();};
$('#zout').onclick=()=>{st.zoom=Math.max(.4,st.zoom/1.2);refresh();};
$('#zfit').onclick=()=>{ const v=$('#v-'+st.view); const W=st.view==='dep'?1100:1300, H=st.view==='dep'?810:950; const top=st.view==='overview'?46:0; st.zoom=Math.max(.4,(v.clientWidth-24)/W); refresh(); };
$('#present').onclick=()=>{ document.body.classList.toggle('present'); setTimeout(()=>$('#zfit').click(),50); };

/* 讲解路线 */
$('#tour').innerHTML='<option value="">讲解路线…</option>'+TOURS.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
function tourShow(){
  const t=TOURS.find(x=>x.id===st.tour); const s=t.steps[st.step];
  $('#tourbar').style.display='flex';
  $('#tourtxt').innerHTML=`<b>${esc(t.name)}</b> 第 ${st.step+1} / ${t.steps.length} 步：${esc(s.text)}`;
  $('#tprev').disabled=st.step===0; $('#tnext').disabled=st.step===t.steps.length-1;
  applyHL('ov');
}
$('#tour').addEventListener('change',e=>{ if(!e.target.value){ endTour(); return; } st.tour=e.target.value; st.step=0; st.sel=null; st.selEdge=null; st.selContract=null; setView('overview'); tourShow(); });
function endTour(){ st.tour=null; $('#tourbar').style.display='none'; $('#tour').value=''; applyHL('ov'); }
$('#tprev').onclick=()=>{ st.step--; tourShow(); };
$('#tnext').onclick=()=>{ st.step++; tourShow(); };
$('#texit').onclick=endTour;
document.addEventListener('keydown',e=>{ if(!st.tour) return; if(e.key==='ArrowRight'&&!$('#tnext').disabled){st.step++;tourShow();} if(e.key==='ArrowLeft'&&!$('#tprev').disabled){st.step--;tourShow();} if(e.key==='Escape') endTour(); });

/* 搜索 */
const IDX=[];
NODES.forEach(n=>IDX.push({t:'模块',l:n.name,s:n.desc,go:()=>{setView('overview');st.sel=n.id;showNode(n.id);applyHL('ov');}}));
GROUPS.forEach(g=>g.tables.forEach(t=>{ IDX.push({t:'表',l:t.name,s:(t.desc||'')+' · '+g.name,go:()=>openTable(t.name)});
  (t.columns||[]).forEach(c=>{const r=Array.isArray(c)?c:[c.name,c.type,c.desc]; IDX.push({t:'列',l:t.name+'.'+r[0],s:String(r[2]).replace(/`/g,''),go:()=>openTable(t.name)});}); }));
CONTRACTS.forEach(c=>{ IDX.push({t:'契约',l:c.id+' '+c.name,s:c.items.map(i=>i.iface).join('、'),go:()=>{st.selContract=c.id;showContract(c.id);setView('dep');}});
  c.items.forEach(i=>IDX.push({t:'接口',l:i.iface,s:c.id+' '+c.name+' · '+i.methods,go:()=>{st.selContract=c.id;showContract(c.id);setView('dep');}})); });
MECHS.forEach(m=>IDX.push({t:'机制',l:m.t,s:m.one,go:()=>setView('mechs')}));
$('#q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase(); const box=$('#results');
  if(!q){ box.style.display='none'; return; }
  const r=IDX.filter(x=>(x.l+' '+x.s).toLowerCase().includes(q)).slice(0,40);
  box.innerHTML=r.length?r.map((x,i)=>`<div class="ri" data-i="${IDX.indexOf(x)}"><span class="rt">${x.t}</span> <b>${esc(x.l)}</b> <span class="mut">${esc(x.s).slice(0,80)}</span></div>`).join(''):'<div class="ri mut">没有结果</div>';
  box.style.display='block';
});
$('#results').addEventListener('click',e=>{ const r=e.target.closest('.ri[data-i]'); if(!r) return; IDX[+r.dataset.i].go(); $('#results').style.display='none'; });
document.addEventListener('click',e=>{ if(!e.target.closest('#search')) $('#results').style.display='none'; });

/* 图例 */
$('#legend').innerHTML='<b>负责人</b> '+Object.entries(OWNERS).map(([k,v])=>`<span class="lg"><i style="background:${v}"></i>${k}</span>`).join('')+
 ' <b>状态</b> '+Object.entries(STATUS).map(([k,v])=>`<span class="lg" title="${esc(v.d)}"><i class="dot" style="background:${v.c}"></i>${k}</span>`).join('')+
 ' <b>连线</b> '+Object.entries(KINDS).map(([k,v])=>`<span class="lg"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="${v.color}" stroke-width="2" stroke-dasharray="${v.dash}"/></svg>${v.name}</span>`).join('');
$('#kinds').innerHTML=Object.entries(KINDS).map(([k,v])=>`<label><input type="checkbox" class="kindcb" id="kind-${k}" checked> <span style="color:${v.color}">${v.name}</span></label>`).join('');
$$('.kindcb').forEach(cb=>cb.addEventListener('change',refresh));
$('#f-owner').innerHTML='<option value="">全部负责人</option>'+Object.keys(OWNERS).filter(o=>o!=='外部').map(o=>`<option>${o}</option>`).join('');

$('#panel').innerHTML='<h2>怎么看这张图</h2><ul><li>鼠标指向一个方块：它的所有连线高亮。</li><li>点方块：旁边展开它的功能，这里显示详情（契约、连线、表）。</li><li>点连线：这里显示经过哪些契约、哪些接口。</li><li>顶部可以按负责人、阶段、状态筛选，按连线类型开关。</li><li>「讲解路线」一步步高亮一条业务流程，可用左右方向键翻页。</li><li>「汇报模式」放大图、隐藏面板，适合投屏。</li></ul><p class="mut">模块之间不共享表：每个模块只读写自己的表，要别人的数据就调对方的接口，表里只存对方的编号。所以图里没有「表连表」的线。</p><p class="mut">「判权」（所有模块调身份权限）和「审计」（所有模块发审计事件）每个模块都有，默认收起，勾选顶部「显示判权、审计连线」才画出来。</p><p class="mut">模块之间的契约连线平时画得淡，鼠标指向模块或点击时才加粗并显示契约编号。</p>';
(function(){ const h=new URLSearchParams(location.hash.slice(1)); const v=h.get('view')||'overview'; setView(v);
  if(h.get('tour')){ st.tour=h.get('tour'); st.step=+(h.get('step')||0); tourShow(); }
  if(h.get('sel')){ st.sel=h.get('sel'); showNode(st.sel); applyHL(v==='dep'?'dep':'ov'); }
  if(h.get('table')) openTable(h.get('table'));
  if(h.get('present')) document.body.classList.add('present'); })();
setTimeout(()=>{ if(st.view==='overview'||st.view==='dep') $('#zfit').click(); },30);
})();

</script>
</body></html>
