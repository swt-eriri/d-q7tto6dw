const tagName = { mine:'你负责', rel:'和你有关', other:'其他', mixed:'有你负责的部分' };

function treeHtml(list) {
  return '<ul>' + list.map(n => `<li class="${n.tag}${n.kids ? '' : ' leaf'}" data-id="${n.id}"><div class="row" data-id="${n.id}"><span class="tw">${n.kids ? (n.open ? '▾' : '▸') : ''}</span><span class="pn">${n.p}</span><span class="cn">${n.n}</span>${n.tag === 'mine' ? '<span class="star">★</span>' : ''}</div>${n.kids ? `<div class="kc" style="display:${n.open ? 'block' : 'none'}">${treeHtml(n.kids)}</div>` : ''}</li>`).join('') + '</ul>';
}
function renderTree() { $('#tree').innerHTML = treeHtml(T); }

function ft(f) { return f.map(([t, s]) => `<div class="ft"><span class="ty" style="background:${TYPES[t][1]}">${TYPES[t][0]}</span><span>${s}</span></div>`).join(''); }
function showNode(id) {
  const n = NODES[id]; state = { v:'node', id };
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('sel', r.dataset.id === id));
  for (let p = n.parent; p; p = p.parent) { p.open = 1; }
  syncOpen();
  let h = `<h2><span class="pn">${n.full}</span><span class="badge b-${n.tag}">${tagName[n.tag]}</span></h2><div class="sub">${n.n}${n.owner ? '　·　负责：' + n.owner : ''}${n.phase ? '　·　' + n.phase + ' 做' : ''}</div>`;
  h += `<div class="one">${n.one}</div>`;
  if (n.what) h += `<div class="card"><h3>它是干什么的</h3>${n.what}</div>`;
  if (n.f) h += `<div class="card"><h3>里面是什么文件</h3>${ft(n.f)}</div>`;
  if (n.inside) h += `<div class="card"><h3>里面有什么</h3><ul>${n.inside.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
  if (n.rel) h += `<div class="card relc"><h3>${n.tag === 'mine' || n.tag === 'mixed' ? '补充' : '和你的关系'}</h3>${n.rel}</div>`;
  if (n.kids) h += `<div class="card"><h3>下一层（点开看）</h3><div class="kids">${n.kids.map(k => `<div class="kid ${k.tag}-k" data-id="${k.id}"><span class="pn">${k.p}</span> ${k.n}<div>${k.one}</div></div>`).join('')}</div></div>`;
  if (n.src) h += `<div class="meta">出处：${n.src}</div>`;
  $('#view').innerHTML = h; $('#view').scrollTop = 0; setTab(null); location.hash = 'f=' + encodeURIComponent(n.full);
}
function syncOpen() {
  document.querySelectorAll('#tree li').forEach(li => { const n = NODES[li.dataset.id]; if (!n.kids) return; const kc = li.querySelector(':scope>.kc'); kc.style.display = n.open ? 'block' : 'none'; li.querySelector(':scope>.row .tw').textContent = n.open ? '▾' : '▸'; });
}
const go = (p, label) => { const n = byPath[p]; return `<span class="go ${n && n.tag === 'rel' ? 'r' : n && n.tag === 'other' ? 'o' : ''}" data-p="${p}">${label || p}</span>`; };

const LBL = {
  http:'<span class="how h-http">HTTP</span>', java:'<span class="how h-java">Java 调用</span>',
  mix4:'<span class="how h-java">Java 调用：要令牌</span><span class="how h-http">网络：交给 DSH 主机上的守护程序</span>',
  mix6:'<span class="how h-java">Java 调用：取 uid</span><span class="how h-http">网络：调取数网关</span>',
  mix7:'<span class="how h-http">网络：MCP 协议</span><span class="how h-java">Java 调用：校验令牌</span>' };
const VIEWS = {
home: () => `<h2>先看这里</h2><div class="sub">左边是仓库的文件夹，点任意一个，右边讲它是干什么的。黄色是你负责的，蓝色是别人的但和你有关。</div>
<div class="big">
<div class="card"><h3>① 顶层 9 个文件夹</h3><ul>
<li>${go('apps/')}：程序入口（4 个程序）</li><li>${go('backend/')}：后端 Java 代码</li><li>${go('packages/')}：共用包（契约、前端组件等）</li>
<li>${go('agents/')}：Agent 代码包</li><li>${go('tests/')}：跨模块测试</li><li>${go('docs/')}：文档</li><li>${go('deploy/')}：部署（DSH 主机守护程序）</li><li>${go('scripts/')}：开发脚本</li><li>${go('dev/')}：本地开发环境配置</li></ul></div>
<div class="card"><h3>② 你负责的部分</h3><ul>
<li><b>框架（0004）</b>：${go('apps/platform-api/','请求进程')}、${go('apps/platform-worker/','后台进程')}、${go('backend/kernel/','内核')}、${go('backend/http/','请求入口')}、${go('backend/bootstrap/','启动引导')}、${go('backend/migrations/platform/','框架的表')}、${go('dev/','本地 MySQL 配置')}</li>
<li><b>身份模块（0006）</b>：${go('backend/modules/identity/')}（7 个子文件夹）、${go('backend/migrations/identity/','七张表')}、${go('packages/contracts/modules/identity/','接口说明')}</li></ul></div>

<li><span class="how h-java">Java 调用</span> 程序内部模块调模块：直接调对方的 <code>api/</code>，不走网络</li></ul>看顶部「一次请求怎么走」。</div>
<div class="card"><h3>④ 每个业务模块都长一个样</h3><code>api/</code> 对外接口 · <code>events/</code> 事件 · <code>domain/</code> 规则 · <code>store/</code> 读写数据库 · <code>http/</code> 页面接口 · <code>jobs/</code> 定时任务 · <code>tests/</code> 测试<br>别的模块只能用 <code>api/</code>。看 ${go('backend/modules/identity/','你的模块')} 就懂了其他的。</div>
</div>
<div class="card"><h3>两件容易误会的事</h3><ul><li>这些文件夹<b>现在仓库里还没有</b>，要等工程基线（0003）把骨架建出来。</li><li>0003 原文写的是 PostgreSQL、JDK 21；行内实际是 TDSQL MySQL、JDK 17，本图按实际环境写。</li></ul></div>`,

flow: () => `<h2>一次请求怎么走</h2><div class="sub">两个例子，看代码在哪些文件夹之间流转。点文件夹名会跳到它的讲解。</div>
<div class="flow"><h3>例一：张三登录（从外面来的请求）</h3><div class="d">全程是一次 HTTP 请求，进了后端以后在模块内部流转。</div>
${[
 [`张三在浏览器打开工作台。网页本身是 ${go('apps/workbench/')} 打包出来的静态文件。`, ''],

 [`${go('backend/http/','请求入口')} 先做公共处理：记请求 ID、看路径属于哪一类、按 ${go('packages/contracts/modules/identity/','openapi.yaml')} 检查请求格式。登录接口本身不要求已登录。`, ''],

 [`返回响应，带上登录 cookie。`, '']
].map((s, i) => `<div class="step"><i>${i + 1}</i><div class="b">${s[0]}${s[1] === 'http' ? '<span class="how h-http">HTTP</span>' : ''}</div></div>`).join('')}</div>
<div class="flow"><h3>例二：张三发一条消息，Agent 去取数（外部请求 + 模块之间调用）</h3><div class="d">红色标签走网络（HTTP 等），绿色标签是程序内部的 Java 调用、不走网络。</div>
${[
 [`网页发 HTTP 请求给会话模块的接口，到达请求进程。`, 'http'],
 [`${go('backend/http/','请求入口')} 拿 cookie 认人：调身份模块 ${go('backend/modules/identity/api/','api/')} 的「认人」，得到「用户张三」（结果缓存 30 秒）。`, 'java'],
 [`交给 ${go('backend/modules/conversations/','会话模块')}。它执行前调身份模块的「判权」，问张三有没有对话这项能力。`, 'java'],
 [`会话模块要用张三的 DSH 进程 → ${go('backend/adapters/dsh/','DSH 适配层')} 起进程前，通过 ${go('backend/bootstrap/','启动引导')} 接好的线向身份模块要一把进程令牌 → ${go('deploy/','DSH 主机守护程序')} 把令牌放进进程的环境变量。`, 'mix4'],
 [`Agent 要取数：DSH 里的 ${go('packages/agent-sdk/','桥接插件')} 发 HTTP 回调 <code>/internal/tool/v1</code> 回平台 → ${go('backend/http/','请求入口')} 验签名、查出这次是替张三干活。`, 'http'],
 [`交给 ${go('backend/modules/data-access/','数据访问模块')}，它调身份模块的「取网关 uid」→ 经 ${go('backend/adapters/gateway/','取数网关客户端')} 把 uid 带给取数网关。`, 'mix6'],
 [`如果 Agent 调的是 mem0 这种 MCP 服务：请求直接发给 ${go('backend/adapters/mcp-proxy/','MCP 代理')}，不经过请求入口；代理拿进程令牌调身份模块的「校验令牌」认人。`, 'mix7']
].map((s, i) => `<div class="step"><i>${i + 1}</i><div class="b">${s[0]}${LBL[s[1]]}</div></div>`).join('')}</div>`,

faq: () => `<h2>常见疑问</h2><div class="sub">点问题展开。</div><div class="faq">${FAQ.map(([q, a]) => `<details><summary>${q}</summary>${a}</details>`).join('')}</div>`,

types: () => `<h2>文件类型</h2><div class="sub">仓库里会出现的文件，大致就这几种。</div><table class="t"><tr><th>类型</th><th>后缀</th><th>是什么</th><th>主要在哪</th></tr>
<tr><td><span class="ty" style="background:${TYPES.java[1]}">Java</span></td><td>.java</td><td>后端代码。接口、类、记录类型都是 .java</td><td>backend/、apps/platform-api、apps/platform-worker、packages/dsh-client</td></tr>
<tr><td><span class="ty" style="background:${TYPES.sql[1]}">SQL</span></td><td>.sql</td><td>建表改表语句，部署时由 Flyway 执行</td><td>backend/migrations/</td></tr>
<tr><td><span class="ty" style="background:${TYPES.yaml[1]}">YAML</span></td><td>.yaml</td><td>结构化的文本配置。openapi.yaml 是 HTTP 接口说明；module.yaml 是模块清单</td><td>packages/contracts/、各模块</td></tr>
<tr><td><span class="ty" style="background:${TYPES.json[1]}">JSON</span></td><td>.json</td><td>由 Java 类型导出的格式说明、样例</td><td>packages/contracts/</td></tr>

<tr><td><span class="ty" style="background:${TYPES.cfg[1]}">配置</span></td><td>build.gradle.kts、package.json、pyproject.toml、my.cnf、.env.example</td><td>构建配置（依赖、怎么编译打包）和环境配置</td><td>各程序和包的根目录、dev/</td></tr>
<tr><td><span class="ty" style="background:${TYPES.md[1]}">Markdown</span></td><td>.md</td><td>文档。<b>只用于文档</b>，契约不是 md</td><td>docs/、各处 README</td></tr></table>`,

names: () => `<h2>命名规律</h2><div class="sub">文件夹名里反复出现的词，各有固定意思。</div><table class="t"><tr><th>词</th><th>意思</th><th>在哪出现</th></tr>${NAMES.map(r => `<tr><td><code>${r[0]}</code></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`
};
let state = { v:'home' };
function setTab(v) { document.querySelectorAll('header button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
function showView(v) { state = { v }; $('#view').innerHTML = VIEWS[v](); $('#view').scrollTop = 0; setTab(v); document.querySelectorAll('.row').forEach(r => r.classList.remove('sel')); location.hash = 'v=' + v; }

document.addEventListener('click', e => {
  const b = e.target.closest('header button'); if (b) return showView(b.dataset.v);
  const g = e.target.closest('.go'); if (g) { const n = byPath[g.dataset.p]; if (n) showNode(n.id); return; }
  const k = e.target.closest('.kid'); if (k) return showNode(k.dataset.id);
  const r = e.target.closest('.row');
  if (r) { const n = NODES[r.dataset.id];
    if (e.target.classList.contains('tw') && n.kids) { n.open = !n.open; syncOpen(); return; }
    if (n.kids) { n.open = state.id === n.id ? !n.open : 1; syncOpen(); }
    showNode(n.id); }
});
$('#dt').textContent = DATE;
renderTree();
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.get('f') && byPath[hp.get('f')]) showNode(byPath[hp.get('f')].id); else showView(hp.get('v') && VIEWS[hp.get('v')] ? hp.get('v') : 'home');

</script></body></html>
